    if (present !== undefined) slot.present = present;
    else slot.present = true;
    render();
  };

  if (f.type === 'bool') {
    const cb = el('input', { type: 'checkbox' });
    cb.checked = !!slot.value;
    // THE DISABLE THAT WAS HERE UNTIL split-config-into-toggleable-slices:
    //   cb.disabled = !slot.present && f.in === 'cfg';
    // with the reason "a cfg key this tool can see but the file does not carry
    // is not something it will create". That was right while ckf.hardmode.cfg
    // held every key the plugin bound. It is wrong now: 43 schemas declare a
    // cfg key and the live file carries one, so this greyed out all 42 slice
    // toggles and the editor could not set a slice at all until someone
    // launched the game. CfgFile.set_value appends a key the file does not
    // carry, so the control stays live. setBool sets slot.present, which is
    // what puts the flipped key into buildEdits' payload.
    cb.addEventListener('change', function () { setBool(sch, f, cb.checked); });
    ctl.appendChild(el('label', { class: 'chk' }, [cb,
      el('span', { text: slot.value ? 'true' : 'false' })]));
  } else if (f.type === 'enum') {
    const sel = el('select', {});
    for (const v of (f.values || [])) {
      const o = el('option', { value: v, text: v });
      if (String(slot.value) === String(v)) o.selected = true;
      sel.appendChild(o);
    }
    sel.addEventListener('change', function () { commit(sel.value); });
    ctl.appendChild(sel);
  } else if (f.type === 'stringList') {
    const inp = el('input', { type: 'text', size: '52' });
    inp.value = Array.isArray(slot.value) ? slot.value.join(', ') : (slot.value || '');
    inp.addEventListener('change', function () {
      commit(inp.value.split(',').map(function (s) { return s.trim(); })
        .filter(function (s) { return s !== ''; }));
    });
    ctl.appendChild(inp);
    ctl.appendChild(el('span', { class: 'small',
      text: 'comma separated, one line (README.md:88-90)' }));
  } else {
    const inp = el('input', { type: 'text', size: f.type === 'string' ? '40' : '14' });
    inp.value = slot.present ? CKF.fmtCell(slot.value) : '';
    if (!slot.present) inp.placeholder = '— unset —';
    inp.addEventListener('change', function () {
      if (f.in === 'json') {
        const r = CKF.coerceCell(f.type, inp.value);
        if (!r.ok) { inp.classList.add('bad'); return; }
        commit(r.value, r.present);
      } else {
        const r = CKF.coerceCell(f.type === 'floatOrNaN' && inp.value.trim() === 'NaN'
          ? 'string' : f.type, inp.value);
        if (!r.ok) { inp.classList.add('bad'); return; }
        commit(f.type === 'floatOrNaN' && inp.value.trim() === 'NaN' ? 'NaN' : r.value, true);
      }
    });
    ctl.appendChild(inp);
    if (!CKF.inRange(slot.value, f.range))
      ctl.appendChild(el('span', { class: 'pill retro', text: 'out of range' }));

    // The key's state is still reported; what is gone is the button that
    // toggled it. An empty box is how a numeric key is dropped.
    if (f.in === 'json') {
      ctl.appendChild(el('span', { class: 'small',
        text: slot.present ? 'key present' : 'key absent — ' + (f.absent || 'the mod default applies') }));
    }
  }

  // What a key that is not in the file yet says. 3.0's line here read
  // 'not in the file — launch the game once to have BepInEx write it', which
  // described a tool that would not write it. Saving now appends it, so the
  // note says what saving will do instead of telling the player to go and do
  // it themselves. The .cfg is not named: app.html carries no filename, which
  // is what hardcoded_names_in_app_html exists to keep true.
  if (f.in === 'cfg' && !slot.present) {
    ctl.appendChild(el('span', { class: 'small',
      text: 'not in the file yet — saving adds it' }));
  }
  return ctl;
}

// REMOVED IN 3.0: pairRow, the one checkbox that wrote two gates. No subsystem
// declares both a cfg gate and a document gate any more -- Phase 3 deleted the
// outer one -- so every gate is an ordinary bool field rendered by fieldRow.

function fieldRow(sch, f) {
  const gate = gateState(sch, f);
  const row = el('div', { class: 'field' + (gate === true ? '' : ' disabled') });
  row.appendChild(el('label', { class: 'lab' }, [
    document.createTextNode(f.label || f.path),
    pathCode(sch, f),
  ]));
  const right = el('div', {});
  right.appendChild(formControl(sch, f));
  if (f.docText) right.appendChild(el('div', { class: 'doc', text: f.docText }));
  for (const m of docBitNodes(f)) right.appendChild(m);
  if (gate === null) right.appendChild(el('div', { class: 'meta',
    text: 'its gate ' + f.enabledBy + ' could not be read — shown, not assumed off' }));
  row.appendChild(right);
  return row;
}

// ---------------------------------------------------------------------------
// grids

function cellInput(t, f, row, col, opts) {
  opts = opts || {};
  const fmt = t.formats[col.name] || '';
  const v = row.cells[col.name];
  const td = el('td', {});
  const inp = el('input', { type: 'text', spellcheck: 'false' });
  if (opts.width) inp.setAttribute('style', 'width:' + opts.width + 'ch');
  inp.value = CKF.fmtCell(v);
  inp.disabled = !!opts.readonly;

  const mark = function () {
    td.className = '';
    const cur = row.cells[col.name];
    if (cur === null || cur === undefined) { td.classList.add('unset'); inp.placeholder = '— unset —'; }
    else inp.placeholder = '';
    if (!CKF.inRange(cur, col.range)) td.classList.add('bad');
    if (fmt === 'adjust' && typeof cur === 'string' && !CKF.parseAdjust(cur).ok) td.classList.add('bad');
    if (fmt === 'adjust' && typeof cur === 'string')
      inp.title = CKF.describeAdjust(cur);
    else if (col.range) inp.title = 'range [' + col.range[0] + ', ' + col.range[1] + ']';
    if (opts.classify) opts.classify(td, cur);
  };
  mark();

  inp.addEventListener('input', function () {
    const r = CKF.coerceCell(col.type, inp.value);
    row.cells[col.name] = r.ok ? (r.present ? r.value : null) : inp.value;
    mark();
    updateDirty();
    if (opts.onchange) opts.onchange();
  });

  td.appendChild(inp);
  return td;
}

function gridFor(sch, f, opts) {
  opts = opts || {};
  const name = valueUnitOf(sch, f);
  const t = W.tables[tableKey(name, f.path)];
  const cols = f.row || [];
  const width = {};
  for (const c of cols)
    width[c.name] = CKF.colWidth(c, t.rows.map(function (r) { return r.cells[c.name]; }),
                                 t.formats[c.name] || '');

  const wrap = el('div', { class: 'grid-wrap' });
  const tbl = el('table', { class: 'grid' });
  const thead = el('thead', {}, [el('tr', {},
    cols.map(function (c) {
      return el('th', { text: CKF.softWrap(c.name) + (c.name === t.keyColumn ? ' (key)' : ''),
                        style: 'width:' + width[c.name] + 'ch',
                        title: c.name + ' — ' + c.type
                               + (c.range ? ', range [' + c.range + ']' : '') });
    }).concat(opts.readonly ? [] : [el('th', { text: '' })]))]);
  tbl.appendChild(thead);
  const tb = el('tbody', {});
  const draw = function () {
    tb.textContent = '';
    t.rows.forEach(function (row) {
      const tr = el('tr', {});
      for (const c of cols) tr.appendChild(cellInput(t, f, row, c,
        { readonly: opts.readonly, onchange: opts.onchange, width: width[c.name] }));
      if (!opts.readonly) tr.appendChild(el('td', {}, [el('button', {
        class: 'rowbtn', text: '✕', title: 'delete this row',
        onclick: function () {
          t.rows.splice(t.rows.indexOf(row), 1); draw(); updateDirty();
          if (opts.onchange) opts.onchange();
        },
      })]));
      tb.appendChild(tr);
    });
  };
  draw();
  tbl.appendChild(tb);
  wrap.appendChild(tbl);

  const box = el('div', {}, [wrap]);
  if (!opts.readonly) {
    box.appendChild(el('div', { class: 'ctl', style: 'margin-top:8px' }, [
      el('button', {
        text: '+ row',
        onclick: function () {
          const cells = {};
          for (const c of cols) cells[c.name] = null;
          t.rows.push({ id: null, cells: cells });
          draw(); updateDirty();
          if (opts.onchange) opts.onchange();
        },
      }),
      t.keyColumn ? el('span', { class: 'small',
        text: 'one row per ' + t.keyColumn }) : null,
    ]));
  }
  // The hatch legend stays on screen: it names the swatch sitting beside it,
  // and "empty means absent, a typed 0 is a real zero" is the one distinction
  // this grid cannot show. Shortened, not moved.
  const anyAdjust = cols.some(function (c) { return (t.formats[c.name] || '') === 'adjust'; });
  box.appendChild(el('div', { class: 'legend' }, [
    el('span', { class: 'sw unset' }), document.createTextNode(
      'Hatched: no key in the file. An empty box means absent; a typed 0 is a real zero.'
      + (anyAdjust ? ' Clearing an adjustment cell turns that slot off — to the '
                     + 'plugin, an empty slot and no slot are the same thing.' : '')),
  ]));
  return box;
}

// ---------------------------------------------------------------------------
// curve: grid plus an editable line chart, x = the first row column

function chartFor(sch, f, redrawGrid) {
  const name = sidecarOf(sch);
  const t = W.tables[tableKey(name, f.path)];
  const cols = f.row || [];
  const xcol = cols[0].name;
  const ycols = cols.slice(1).filter(function (c) { return c.type === 'int' || c.type === 'float'; });
  const shown = {};
  for (const c of ycols) shown[c.name] = true;

  const box = el('div', { class: 'chart' });
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', '0 0 900 325');
  svg.setAttribute('preserveAspectRatio', 'none');
  box.appendChild(svg);

  const legend = el('div', { class: 'series' });
  const PAL = ['#5b8dd6', '#3ea76a', '#c9973f', '#b06fc9', '#d0564a'];
  ycols.forEach(function (c, i) {
    const cb = el('input', { type: 'checkbox' });
    cb.checked = true;
    cb.addEventListener('change', function () { shown[c.name] = cb.checked; draw(); });
    legend.appendChild(el('label', {}, [cb,
      el('span', { style: 'color:' + PAL[i % PAL.length], text: c.name })]));
  });
  legend.appendChild(el('span', { class: 'small',
    text: 'drag a point to change it. A gap in a line is an unset cell, not a zero.' }));
  box.appendChild(legend);

  const PAD = { l: 68, r: 15, t: 15, b: 33 };
  let scale = null;

  function draw() {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    const series = ycols.filter(function (c) { return shown[c.name]; })
      .map(function (c, i) {
        return { col: c, pts: CKF.curvePoints(t.rows, xcol, c.name),
                 color: PAL[ycols.indexOf(c) % PAL.length] };
      });
    const xs = [], ys = [];
    for (const s of series) for (const p of s.pts) { xs.push(p.x); ys.push(p.y); }
    if (!xs.length) {
      const txt = document.createElementNS(svgNS, 'text');
      txt.setAttribute('x', 25); txt.setAttribute('y', 50);
      txt.setAttribute('fill', '#6b7280');
      txt.textContent = 'every point is unset — nothing to plot';
      svg.appendChild(txt);
      scale = null;
      return;
    }
    const x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
    let y0 = Math.min.apply(null, ys.concat([0])), y1 = Math.max.apply(null, ys);
    if (y1 === y0) y1 = y0 + 1;
    const W_ = 900, H_ = 325;
    const sx = function (x) { return PAD.l + (x1 === x0 ? 0.5 : (x - x0) / (x1 - x0)) * (W_ - PAD.l - PAD.r); };
    const sy = function (y) { return H_ - PAD.b - (y - y0) / (y1 - y0) * (H_ - PAD.t - PAD.b); };
    const inv = function (py) { return y0 + (H_ - PAD.b - py) / (H_ - PAD.t - PAD.b) * (y1 - y0); };
    scale = { sx: sx, sy: sy, inv: inv, x0: x0, x1: x1, y0: y0, y1: y1 };

    const mk = function (tag, attrs) {
      const n = document.createElementNS(svgNS, tag);
      for (const k in attrs) n.setAttribute(k, attrs[k]);
      return n;
    };
    for (let i = 0; i <= 4; i++) {
      const y = y0 + (y1 - y0) * i / 4;
      svg.appendChild(mk('line', { x1: PAD.l, x2: W_ - PAD.r, y1: sy(y), y2: sy(y),
        stroke: '#31363f', 'stroke-width': 1 }));
      const tx = mk('text', { x: 8, y: sy(y) + 5, fill: '#6b7280', 'font-size': 14 });
      tx.textContent = (Math.round(y * 100) / 100);
      svg.appendChild(tx);
    }
    const zero = sy(0);
    if (zero > PAD.t && zero < H_ - PAD.b)
      svg.appendChild(mk('line', { x1: PAD.l, x2: W_ - PAD.r, y1: zero, y2: zero,
        stroke: '#4b5563', 'stroke-width': 1, 'stroke-dasharray': '4 3' }));

    for (const s of series) {
      if (s.pts.length > 1) {
        svg.appendChild(mk('polyline', {
          points: s.pts.map(function (p) { return sx(p.x) + ',' + sy(p.y); }).join(' '),
          fill: 'none', stroke: s.color, 'stroke-width': 2,
        }));
      }
      for (const p of s.pts) {
        const c = mk('circle', { cx: sx(p.x), cy: sy(p.y), r: 5.5, fill: s.color,
          stroke: '#14161a', 'stroke-width': 1.5, style: 'cursor:ns-resize' });
        c.addEventListener('pointerdown', function (ev) {
          ev.preventDefault();
          c.setPointerCapture(ev.pointerId);
          const move = function (e2) {
            const r = svg.getBoundingClientRect();
            const py = (e2.clientY - r.top) / r.height * H_;
            let v = scale.inv(py);
            v = (s.col.type === 'int') ? Math.round(v) : Math.round(v * 1000) / 1000;
            if (s.col.range) v = Math.min(Math.max(v, s.col.range[0]), s.col.range[1]);
            const row = t.rows.find(function (r2) { return r2.id === p.id; });
            if (row) { row.cells[s.col.name] = v; draw(); updateDirty(); }
          };
          const up = function () {
            c.removeEventListener('pointermove', move);
            c.removeEventListener('pointerup', up);
            redrawGrid();
          };
          c.addEventListener('pointermove', move);
          c.addEventListener('pointerup', up);
        });
        const ttl = mk('title', {});
        ttl.textContent = xcol + ' ' + p.x + ' → ' + s.col.name + ' ' + p.y;
        c.appendChild(ttl);
        svg.appendChild(c);
      }
    }
    const xt0 = mk('text', { x: PAD.l, y: H_ - 10, fill: '#6b7280', 'font-size': 14 });
    xt0.textContent = xcol + ' ' + x0;
    svg.appendChild(xt0);
    const xt1 = mk('text', { x: W_ - PAD.r - 75, y: H_ - 10, fill: '#6b7280', 'font-size': 14 });
    xt1.textContent = String(x1);
    svg.appendChild(xt1);
  }
  draw();
  box.__redraw = draw;
  return box;
}

// ---------------------------------------------------------------------------
// matrix: a 2-D grid over `axes`, laid over the field named by `over`

function matrixFor(sch, f, opts) {
  opts = opts || {};
  const ro = !!opts.readonly;
  // The axes always come from the editable field. A readonly reference table
  // declares none of its own; it is drawn on the axes of the control it is the
  // reference for, which is what makes the two grids the same grid.
  const owner = opts.owner || f;
  const axes = owner.axes;
  const name = sidecarOf(sch);
  const t = W.tables[tableKey(name, f.path)];
  const otherField = ro ? owner
    : (f.over ? sch.fields.find(function (g) { return g.path === f.over; }) : null);
  const other = otherField ? W.tables[tableKey(name, otherField.path)] : null;
  const dom = CKF.matrixDomain(t.rows, other ? other.rows : [], axes);
  const spec = owner.row || f.row || [];
  const valCol = spec.find(function (c) { return c.name === axes.value; }) || { type: 'float' };
  const rowCol = spec.find(function (c) { return c.name === axes.row; }) || {};
  const colCol = spec.find(function (c) { return c.name === axes.col; }) || {};

  // Both grids are windowed identically, on the editable table's occupancy, so
  // that a value read off one is found in the same place in the other.
  const win = sch.axisWindows || {};
  const editRows = (ro ? (other ? other.rows : []) : t.rows);
  const occupied = function (key) {
    return editRows.map(function (r) { return r.cells[key]; })
                   .filter(function (v) { return v != null; });
  };
  const vcol = CKF.visibleAxis(dom.cols, win[axes.col], occupied(axes.col));
  const vrow = CKF.visibleAxis(dom.rows, win[axes.row], occupied(axes.row));

  const at = function (tab, r, c) {
    if (!tab) return null;
    return tab.rows.find(function (x) {
      return Number(x.cells[axes.row]) === r && Number(x.cells[axes.col]) === c;
    }) || null;
  };
  const stockAt = function (r, c) {
    const hit = at(other, r, c);
    return hit ? hit.cells[axes.value] : null;
  };

  // One width for every cell in the matrix: they all hold the same column's
  // values, so a per-column width would only make the grid ragged. Both
  // tables' values count, so the reference grid and the one it is a reference
  // for come out the same width and read as the same grid.
  const cellW = CKF.colWidth(valCol,
    t.rows.map(function (r) { return r.cells[axes.value]; })
      .concat(other ? other.rows.map(function (r) { return r.cells[axes.value]; }) : []), '');

  const wrap = el('div', { class: 'grid-wrap' });
  const tbl = el('table', { class: 'grid' });
  const head = el('tr', {}, [el('th', { class: 'axis',
    text: CKF.softWrap(axes.row) + ' \\ ' + CKF.softWrap(axes.col) })]
    .concat(vcol.shown.map(function (c) {
      return el('th', { text: String(c),
                        title: vcol.outside.indexOf(c) >= 0
                          ? 'outside the range normally shown, and here because a value '
                            + 'sits in this column' : '' });
    })));
  tbl.appendChild(el('thead', {}, [head]));
  const tb = el('tbody', {});

  for (const r of vrow.shown) {
    const tr = el('tr', {}, [el('td', { class: 'axis', text: String(r) })]);
    for (const c of vcol.shown) {
      const row = at(t, r, c);
      const st = ro ? null : stockAt(r, c);
      const td = el('td', {});
      const inp = el('input', { type: 'text' });
      inp.setAttribute('style', 'width:' + cellW + 'ch');
      inp.disabled = ro;
      const paint = function () {
        td.className = '';
        const cur = row ? row.cells[axes.value] : null;
        if (row && cur !== null && cur !== undefined) {
          if (!ro) td.classList.add('setcell');
          inp.value = CKF.fmtCell(cur);
          inp.placeholder = '';
          inp.title = ro ? "the game's own value here"
            : ('set here' + (st !== null ? ' — stock ' + st : ' — no stock cell'));
          if (!CKF.inRange(cur, valCol.range)) td.classList.add('bad');
        } else {
          inp.value = '';
          if (ro) {
            td.classList.add('unset');
            inp.placeholder = '— none —';
            inp.title = 'the game ships no value for this cell';
          } else {
            td.classList.add('inherit');
            inp.placeholder = st === null ? '— none —' : String(st);
            inp.title = st === null
              ? 'no override and no stock cell here'
              : 'inherits ' + st + ' from ' + (otherField ? otherField.path : 'the stock table');
          }
        }
      };
      paint();
      if (!ro) inp.addEventListener('change', function () {
        const res = CKF.coerceCell(valCol.type, inp.value);
        if (!res.ok) { td.classList.add('bad'); return; }
        const existing = at(t, r, c);
        if (!res.present) {
          if (existing) t.rows.splice(t.rows.indexOf(existing), 1);
        } else if (existing) {
          existing.cells[axes.value] = res.value;
        } else {
          const cells = {};
          for (const col of spec) cells[col.name] = null;
          cells[axes.row] = r; cells[axes.col] = c; cells[axes.value] = res.value;
          t.rows.push({ id: null, cells: cells });
        }
        render();
      });
      td.appendChild(inp);
      tr.appendChild(td);
    }
    tb.appendChild(tr);
  }
  tbl.appendChild(tb);
  wrap.appendChild(tbl);

  const addAxis = function (which, colspec) {
    const inp = el('input', { type: 'text', size: '5' });
    return el('span', { class: 'ctl' }, [
      el('span', { class: 'small', text: 'add ' + which + ':' }), inp,
      el('button', {
        text: 'add',
        onclick: function () {
          const r = CKF.coerceCell(colspec.type || 'int', inp.value);
          if (!r.ok || !r.present) return;
          if (!CKF.inRange(r.value, colspec.range)) { inp.classList.add('bad'); return; }
          const cells = CKF.newMatrixCells(spec, axes, which, r.value,
                                           vrow.shown[0], vcol.shown[0]);
          t.rows.push({ id: null, cells: cells });
          render();
        },
      }),
    ]);
  };

  const box = el('div', {}, [wrap]);
  if (!ro) box.appendChild(el('div', { class: 'ctl', style: 'margin-top:8px' },
    [addAxis(axes.row, rowCol), addAxis(axes.col, colCol)]));

  // What the window is hiding, said out loud. Nothing here is dropped on save:
  // the file is written from every row the table holds, not from the cells on
  // screen, and a hidden coordinate that acquires a value stops being hidden.
  const notes = [];
  for (const ax of [{ n: axes.col, v: vcol }, { n: axes.row, v: vrow }]) {
    if (ax.v.hidden.length)
      notes.push(ax.n + ' ' + ax.v.hidden.join(', ') + ' '
        + (ax.v.hidden.length === 1 ? 'is' : 'are') + ' not shown — nothing is set there. '
        + 'A save leaves those cells exactly as they are.');
    if (ax.v.outside.length)
      notes.push(ax.n + ' ' + ax.v.outside.join(', ')
        + ' would normally be hidden, and is shown because a value sits there.');
  }
  if (ro) {
    notes.push('Reference only: the game\'s own values, on the same grid as the '
      + 'control above. Changing them would change no award.');
  } else {
    notes.push('An empty cell has no override row and inherits the greyed value. '
      + 'Clearing a cell removes its row — that is unset, not zero.'
      + (otherField ? ' Underlay: ' + otherField.path + ' (reference, not a control).' : ''));
  }
  box.appendChild(el('div', { class: 'legend', text: notes.join(' ') }));
  return box;
}

// ---------------------------------------------------------------------------
// mission reference sidecar, when the file exists

function referenceFor(sch, f) {
  const ref = MODEL.missionReference;
  const t = W.tables[tableKey(sidecarOf(sch), f.path)];
  if (ref.state !== 'loaded' || !t.keyColumn) return null;
  const known = t.rows.filter(function (r) {
    return ref.byType[String(r.cells[t.keyColumn])];
  }).length;
  return el('div', { class: 'small', style: 'margin-top:8px' }, [document.createTextNode(
    'docs/mission-reference.json: shipped values available for ' + known + ' of '
    + t.rows.length + ' rows (hover a key cell).')]);
}

// ---------------------------------------------------------------------------
// panel

// One field that is not a plain form control: a grid, a curve or a matrix.
// ---------------------------------------------------------------------------
// overlays: the CSV files a slice owns, rendered
//
// A talent pack declares no field per file and no row[]: `targets.overlays` is
// the whole declaration, and the COLUMNS COME FROM EACH FILE'S OWN HEADER at
// render time. rules_to_overlays.py derives them per file from what that
// pack's rules touch and they range 2 to 15 across the 32 files, so a static
// row[] would be 32 hand-copies that go stale on its next run.
//
// WAS, until 2026-09-14: "READ ONLY. rules_to_overlays.py is the only thing
// that may write these, so nothing here builds a control: every cell is text,
// no cell is in an edit set, and a save cannot reach one."
//
// CORRECTION. David reversed that on 2026-09-14, scoped to LEVER AND OVERRIDE
// COLUMNS ONLY. The reason the old rule carried — that rules_to_overlays.py
// was the only thing that might write these files — had already lapsed when
// Phase 9 retired that script together with its subject. What replaced it is
// not a policy in this file: the server grades every column identity, lever or
// control and publishes `writable` per sheet and `editable` per column, and
// this page offers a box exactly where `editable` is true and nowhere else.
// An identity cell names WHICH row a line is about, a control cell is a
// comment, and the key is the id Overlays.LoadTable refuses the line without;
// none of the three is an override and none of the three takes an edit.
function overlaysOf(sch) {
  const t = sch.targets || {};
  const o = t.overlays;
  return o ? (Array.isArray(o) ? o : [o]) : [];
}
function overlayEntry(rel) {
  return (MODEL.values.overlays || {})[rel] || null;
}
// The reference field, if any, that annotates an overlay: one whose declared
// columns include the column the overlay keys on. Derived from the two
// declarations rather than written down, so neither name appears here.
function referenceAnnotating(sch, ov) {
  if (!ov || !ov.keyColumn) return null;
  return (sch.fields || []).find(function (f) {
    return f.in === 'reference' && (f.row || []).some(function (c) {
      return c.name === ov.keyColumn; });
  }) || null;
}
function referenceRowsOf(sch, f) {
  const t = W.tables[tableKey(sch.subsystem, f.path)];
  return t ? t.rows : [];
}
// Rows of one overlay, joined to its reference and grouped.
//
// THE PL-3 PAIRS. Twelve rules exist twice, once plain and once with a
// constant suffix on their name, and their shipped values differ on eight of
// the twelve — so folding them into one row would make "faster early,
// unchanged later" inexpressible. They stay two rows, drawn adjacent, with the
// suffix as the second row's badge. The suffix is DERIVED: a row whose name is
// another row's name plus a remainder is that row's variant, and the remainder
// is what the badge says. Nothing here spells it.
function overlayGroups(sch, ov) {
  const ref = referenceAnnotating(sch, ov);
  const byKey = {};
  if (ref) {
    const kc = ov.keyColumn;
    for (const r of referenceRowsOf(sch, ref)) byKey[String(r.cells[kc])] = r.cells;
  }
  const gcol = ref ? ref.groupBy : null;
  // the reference's own label column: the non-key, non-group column the
  // variant pairing reads. The first string column that is not either.
  let namecol = null;
  if (ref) {
    const c = (ref.row || []).find(function (x) {
      return x.type === 'string' && x.name !== ov.keyColumn && x.name !== gcol; });
    namecol = c ? c.name : null;
  }
  const rows = ov.rows.map(function (r, i) {
    const key = r.cells[0];
    return { i: i, key: key, cells: r.cells, ref: byKey[String(key)] || null };
  });
  // variant pairing, by name prefix
  const nameOf = function (r) {
    return (r.ref && namecol) ? String(r.ref[namecol]) : null; };
  // A NAME PREFIX ALONE IS NOT A PAIRING, which the data says plainly: two
  // separate constants are a penalty and that penalty's distance, and one
  // name is a prefix of the other. Only the LARGEST family of pairs sharing
  // one remainder is treated as a variant set; everything else keeps its own
  // row in id order. Derived, so no remainder is written down here, and a
  // second family does not quietly get indented under the first.
  const cand = [];
  for (const r of rows) {
    const n = nameOf(r);
    if (!n) continue;
    for (const b of rows) {
      const bn = nameOf(b);
      if (b === r || !bn || bn.length >= n.length) continue;
      if (n.indexOf(bn) === 0) cand.push({ r: r, b: b, suffix: n.slice(bn.length).trim() });
    }
  }
  const tally = {};
  for (const c of cand) tally[c.suffix] = (tally[c.suffix] || 0) + 1;
  let best = null;
  for (const k in tally)
    if (best === null || tally[k] > tally[best] || (tally[k] === tally[best] && k < best))
      best = k;
  const sole = best !== null
    && Object.keys(tally).every(function (k) { return k === best || tally[k] < tally[best]; });
  if (sole) for (const c of cand)
    if (c.suffix === best) { c.r.variantOf = c.b; c.r.suffix = c.suffix; }
  const order = [];
  for (const r of rows) {
    if (r.variantOf) continue;
    order.push(r);
    for (const v of rows) if (v.variantOf === r) order.push(v);
  }
  for (const r of rows) if (order.indexOf(r) < 0) order.push(r);
  if (!gcol) return [{ title: null, rows: order }];
  const buckets = {};
  for (const r of order) {
    const g = r.ref ? String(r.ref[gcol]) : '';
    (buckets[g] = buckets[g] || []).push(r);
  }
  // biggest group first, ties by name, so the order is a property of the data
  // and not of the file's line order.
  return Object.keys(buckets).sort(function (a, b) {
    return buckets[b].length - buckets[a].length || (a < b ? -1 : a > b ? 1 : 0);
  }).map(function (g) { return { title: g, rows: buckets[g] }; });
}

// A closed <details> holding lines that are true, wanted, and too many to read
// at once. HIDING IS NEVER DROPPING: every line is still in the document, still
// in its textContent, found by the browser's own search, one click from view.
//
// It exists because of a measurement, not a preference. The notes a sheet
// carries about its blanks are per column PAIR and therefore quadratic: one
// sheet ships 81 of them, one section 89, and across the 53 sheets the live
// config draws that is 517 lines and 98,113 characters -- 76% of every word on
// the page [measured off the live config with serve.py's own api_model,
// 2026-09-14]. Stacked as loose <div class=legend> they buried the grid each
// one annotates. Nothing left the schema or the payload; they left the DEFAULT
// VIEW.
//
// `summary` says how many and what of, so the reader can tell a sheet with
// nothing to say from one with a page of it without opening anything.
function disclosure(summary, nodes) {
  const kids = nodes.filter(Boolean);
  if (!kids.length) return null;
  const det = el('details', { class: 'disc' }, [
    el('summary', { text: summary + ' (' + kids.length + ')' }),
  ]);
  const body = el('div', { class: 'discbody' });
  for (const n of kids) body.appendChild(n);
  det.appendChild(body);
  return det;
}

// ONE LEVER CELL'S BOX, shared by the grid and by the one-row form so the two
// cannot drift. It writes into W.overlays and nowhere else; MODEL keeps what
// the server read, which is what `dirty` is measured against and what the save
// address is built from.
//
// A BLANK CELL IS BOTH TYPEABLE AND LEGIBLE, which is the whole difficulty.
// The greyed "ships 130" used to be a <span> in the cell, and it was there
// because "an empty box and 'ships 130, untouched' look identical otherwise".
// A box and a span cannot occupy the same cell without one of them being a
// lie, so the shipped value became the box's PLACEHOLDER: same grey, same
// place, same words, and now the reader can type over it. Clearing the box
// brings it straight back, and an empty box is sent as an empty FIELD — not 0,
// not "" — so "leave the game's column alone" stays expressible. Where the
// sheet's comment records no shipped value the placeholder is an em dash,
// which is what the span said too.
function overlayInput(ov, rel, ri, ci, opts) {
  opts = opts || {};
  const host = opts.host;
  const base = opts.baseClass || '';
  const col = ov.columns[ci];
  const wrow = W.overlays[rel].cells[ri];
  const src = (ov.rows[ri] || {}).cells || [];
  const orig = String(src[ci] === undefined || src[ci] === null ? '' : src[ci]);
  const ship = ((ov.shipped || {})[String(ri)] || {})[col.name];
  const lab = (ov.labels || {})[col.name];
  const inp = el('input', { type: 'text', spellcheck: 'false' });
  if (opts.width) inp.setAttribute('style', 'width:' + opts.width + 'ch');
  inp.value = String(wrow[ci] === undefined || wrow[ci] === null ? '' : wrow[ci]);

  const paint = function () {
    const v = String(inp.value);
    const cls = [base];
    inp.placeholder = v === '' ? (ship === undefined ? '—' : 'ships ' + ship) : '';
    const why = [col.name + ' — ' + col.op + (lab ? '; here it is ' + lab.why : '')];
    why.push(ship === undefined
      ? 'an empty box leaves the game\'s own column alone'
      : 'the game ships ' + ship + '; an empty box leaves that alone');
    const p = CKF.overlayCellProblem(ov, ci, v);
    if (p && p.bad) { cls.push('bad'); why.push('THE SAVE WILL REFUSE THIS: ' + p.bad); }
    else if (p && p.warn) why.push('NOT CHECKED AGAINST A SCHEMA: ' + p.warn);
    if (v !== orig) {
      cls.push('dirty');
      why.push('changed from ' + (orig || '(blank)') + ' — pending until Save');
    }
    const ref = refusalMark(ov, rel, ci, ri);
    if (ref) {
      cls.push('refused');
      why.push('the last save was refused over this cell, and nothing was '
               + 'written: ' + ref);
    }
    host.className = cls.filter(Boolean).join(' ');
    inp.title = why.join('. ');
  };
  paint();
  inp.addEventListener('input', function () {
    wrow[ci] = inp.value;
    paint();
    updateDirty();
  });
  return inp;
}

function overlayBlock(sch, rel) {
  const ov = overlayEntry(rel);
  const block = el('div', { class: 'field', style: 'grid-template-columns:1fr' });
  const base = rel.split('/').pop();
  block.appendChild(el('div', {}, [
    el('label', { class: 'lab' }, [
      document.createTextNode(base + '  '),
      el('span', { class: 'pill na', text: 'overlay' }),
      el('code', { class: 'loc' }, [el('span', { text: rel })]),
    ]),
  ]));
  // Two failures, said plainly, each with the reason no grid follows. The
  // reason matters and stays: an empty grid and a file that could not be read
  // look identical, so drawing one would answer a question nobody asked.
  if (!ov) {
    block.appendChild(el('div', { class: 'doc', text:
      'The schema declares this file and the server sent nothing for it. No '
      + 'grid is drawn — an empty one would look like a file with no rows.' }));
    return block;
  }
  if (!ov.present || ov.error) {
    block.appendChild(el('div', { class: 'doc', text:
      (ov.present ? 'Could not be read: ' : 'Not on disk: ') + (ov.error || '')
      + ' No grid is drawn — an empty one would look like a file with no rows.' }));
    return block;
  }
  const ref = referenceAnnotating(sch, ov);
  const gcol = ref ? ref.groupBy : null;
  const groups = overlayGroups(sch, ov);
  const refCols = ref ? (ref.row || []).filter(function (c) {
    return c.name !== ov.keyColumn && c.name !== gcol; }) : [];
  // THREE ROLES, not two. The server grades each column identity, lever or
  // control: an IDENTITY column names the row a line describes and a value in
  // it is not an override, which is what stops a sheet that overrides nothing
  // reading as one with 48 edits in it. The roles are derived server-side from
  // the expander's own declaration, so nothing here names a column.
  const roles = ov.roles || [];
  // WHAT MAY BE TYPED IN, decided entirely by the server. `ov.editable[i]` is
  // the only thing consulted: this page does not grade a column and must not,
  // because the grading is derived from the expander that owns the sheet and
  // nothing here is allowed to know one column name from another. A sheet that
  // refuses writes offers no box at all, and says why.
  const canWrite = !!ov.writable;
  const editableAt = function (i) { return canWrite && !!(ov.editable || [])[i]; };
  // Collapsed columns. `shown` is the reader's override, per sheet, and it
  // makes every collapsed column reappear at once — there are at most a
  // handful on any one sheet, so a per-column toggle would be more clicks than
  // columns.
  //
  // TWO REASONS, ONE BUTTON, TWO SENTENCES. A column is off the screen because
  // it never changes within this table (`sup`, the constancy rule, exempt
  // below two rows) or because it is hidden by name (`hid`, declared by the
  // server with its reason, at every row count). They share the button —
  // putting one class of column back and not the other would be two controls
  // for one question — and they do NOT share their wording: each collapsed
  // column is named in the fold with the reason that actually applies to it.
  // `flat` stays the constancy flag alone, because that is what the header's
  // `constant` styling and its "holds one value on every row" tooltip claim,
  // and a hidden-by-name column has not earned that claim.
  const sup = CKF.overlaySuppressed(ov);
  const hid = CKF.overlayHidden(ov);
  const shown = !!OV_SHOWN[rel];
  const idCols = [], valCols = [], ctlCols = [], collapsed = [];
  ov.columns.forEach(function (c, i) {
    if (i === 0) return;                       // drawn as the key, at the left
    const role = roles[i] || (c.control ? 'control' : 'lever');
    const off = sup[i] || !!hid[i];
    const rec = { c: c, i: i, role: role, flat: sup[i], hidden: hid[i] || null };
    if (off) collapsed.push(rec);
    if (off && !shown) return;                 // named in the fold, not drawn
    (role === 'control' ? ctlCols : role === 'identity' ? idCols : valCols)
      .push(rec);
  });
  // THE HEADLINE IS TWO FACTS, NOT SEVEN. This line used to spell out every
  // column count and then restate the read-only rule in a sentence, on every
  // one of the 53 sheets [6,624 characters of it, measured 2026-09-14]. The
  // counts describe a table the reader is looking at, so they moved into the
  // sheet's own notes fold; what stays is what the table cannot show by
  // itself -- which table it is, how big it is, and that it cannot be edited.
  // The full read-only sentence is the pill's tooltip and is repeated in the
  // fold, so the reason is still two ways reachable.
  // The shape counts EVERY column the file has, collapsed ones included — it
  // is a description of the file, not of what fits on screen.
  let nId = 0, nVal = 0, nCtl = 0, nEdit = 0;
  ov.columns.forEach(function (c, i) {
    if (i === 0) return;
    const role = roles[i] || (c.control ? 'control' : 'lever');
    if (role === 'control') nCtl++; else if (role === 'identity') nId++; else nVal++;
    if (editableAt(i)) nEdit++;
  });
  const shape = (nId ? (nId + 1) + ' identity column(s), ' : '')
    + nVal + ' override column(s)'
    + (nCtl ? ', ' + nCtl + ' control column(s)' : '')
    + (gcol ? ', grouped into ' + groups.length : '') + '.';
  // WAS "read only", on every sheet, until 2026-09-14. That pill and its
  // tooltip were true for three phases and are not any more: David reversed the
  // rule and the server now publishes `writable` and `editable` per sheet and
  // per column. The pill reads the payload rather than stating a policy, so a
  // sheet that refuses a write still says so — WITH THE SERVER'S OWN REASON,
  // which is the part that must never be dropped. A sheet that cannot be
  // written and a sheet with nothing in it to write look identical otherwise,
  // and SHEET_SOURCE_ERROR makes every sheet refuse at once.
  block.appendChild(el('div', { class: 'meta' }, [
    document.createTextNode(
      (ov.kind === 'direct' ? ov.table + ' · ' : 'expanded at load · ')
      + ov.rows.length + ' row(s)  '),
    canWrite
      ? el('span', { class: 'pill on', text: nEdit + ' editable column(s)',
                     title: 'Lever and override columns take an edit; identity '
                            + 'columns, control columns and the key do not. An '
                            + 'empty box is not zero — it leaves the game\'s '
                            + 'own column alone.' })
      : el('span', { class: 'pill retro', text: 'not editable',
                     title: ov.writableWhy || 'the server gave no reason' }),
  ]));
  if (!canWrite) {
    block.appendChild(el('div', { class: 'doc', text:
      'This sheet refuses edits: ' + (ov.writableWhy || 'the server gave no '
      + 'reason, which is itself the problem — a refusal with no reason is not '
      + 'a result.') + ' The grid below is what is on disk; no box is offered '
      + 'because a save could not reach one.' }));
  }

  // REMOVED 2026-09-14: THE ONE-ROW FORM. A branch stood here, taken when the
  // server sent `ov.form` (an expanded sheet of exactly one row), and it drew
  // the row as a stack of labelled values instead of a grid. Its reason read:
  //
  //   "ONE ROW IS A FORM, NOT A GRID. design.md section 7. The row count is in
  //    the file and this has already read it to draw it, so nothing declares
  //    the shape and no schema field carries it — a header row above a single
  //    line is a table of one, which is a worse way to read four values."
  //
  // David opened the editor in a browser on 2026-09-14, looked at that page,
  // and overruled it: the one-row sheet is drawn as a table like every other
  // sheet in its family. The reasoning is kept because it was right about
  // everything it measured and wrong only about the preference it inferred.
  // The fix is on the server — `form` is no longer computed or sent — so there
  // is no dead branch here and no dead key there. Everything below this point
  // now runs for every sheet at every row count, which is the whole of the
  // change: a one-row sheet gets the same header, the same key column, the
  // same lever boxes, the same "ships N" placeholders and the same key-tuple
  // address as a twenty-seven-row one.

  const wrap = el('div', { class: 'grid-wrap' });
  const tbl = el('table', { class: 'grid' });
  const head = [el('th', { text: ov.keyColumn + ' (key)' })];
  for (const c of refCols)
    head.push(el('th', { text: CKF.softWrap(c.name),
                         title: c.name + ' — from the schema, not from the file' }));
  for (const v of idCols)
    head.push(el('th', { class: v.flat ? 'constant' : '',
                         text: CKF.softWrap(v.c.name),
                         title: v.c.name + ' — identity: which row this line '
                                + 'describes, not a change to it'
                                + (v.flat ? '; it holds one value on every row '
                                            + 'and is normally collapsed' : '') }));
  // A column whose NAME means two different things in two sheets gets the
  // label the server chose from the expander that owns the sheet, with the
  // raw name kept in the tooltip so nothing is hidden.
  const labelOf = function (n) {
    const l = (ov.labels || {})[n];
    return l ? l.label : n; };
  for (const v of valCols) {
    const l = (ov.labels || {})[v.c.name];
    head.push(el('th', { class: v.flat ? 'constant' : '',
                         text: CKF.softWrap(labelOf(v.c.name))
                               + (v.c.op === 'set' ? '' : ' [' + v.c.op + ']'),
                         title: v.c.name + ' — ' + v.c.op
                                + (l ? '; here it is ' + l.why : '')
                                + '; an empty cell leaves the column alone'
                                + (v.flat ? '; it holds one value on every row '
                                            + 'and is normally collapsed' : '') }));
  }
  for (const v of ctlCols)
    head.push(el('th', { class: v.flat ? 'constant' : '',
                         text: CKF.softWrap(v.c.name) }));
  tbl.appendChild(el('thead', {}, [el('tr', {}, head)]));
  const tb = el('tbody', {});
  for (const g of groups) {
    if (g.title !== null) {
      tb.appendChild(el('tr', { class: 'grouphead' }, [
        el('td', { colspan: String(head.length) }, [
          el('b', { text: g.title }),
          document.createTextNode('  ' + g.rows.length + ' rule(s)')])]));
    }
    for (const r of g.rows) {
      const tr = el('tr', {});
      // The row's id, and — where the server sent one — the name that id
      // stands for beside it. `rowLabels` is read defensively: absent, empty
      // or missing this key is a clean no-op, because the map is a server
      // addition that may or may not have landed, and NOTHING HERE MAY SPELL
      // ONE OF THE NAMES.
      const rowLab = ((ov.rowLabels || {})[String(r.key)] || '');
      tr.appendChild(el('td', { class: 'ro' }, [
        document.createTextNode(String(r.key)),
        rowLab ? el('span', { class: 'small', text: '  ' + rowLab }) : null,
        r.suffix ? el('span', { class: 'pill na', text: r.suffix }) : null]));
      for (const c of refCols)
        tr.appendChild(el('td', { class: 'ro',
          text: r.ref ? String(r.ref[c.name]) : '—' }));
      for (const v of idCols)
        tr.appendChild(el('td', { class: 'ro ident' + (v.flat ? ' constant' : ''),
                                  text: r.cells[v.i] || '' }));
      const shipRow = (ov.shipped || {})[String(r.i)] || null;
      for (const v of valCols) {
        const cell = r.cells[v.i] || '';
        const ship = shipRow ? shipRow[v.c.name] : undefined;
        const mark = (ov.shared || {})[r.i + ',' + v.i];
        // A LEVER CELL IS A BOX WHEN THE SERVER SAYS SO, AND ONLY THEN.
        //
        // A SHARED CELL STAYS EDITABLE. Changing one repoints the row at a
        // different target; it does not change what the shared target does,
        // and the pill beside the box still says so. Making it read-only
        // would be this page deciding a policy the server did not send.
        if (editableAt(v.i)) {
          const td = el('td', {});
          const inp = overlayInput(ov, rel, r.i, v.i, {
            host: td, width: null,
            baseClass: 'editable' + (v.flat ? ' constant' : '')
                       + (mark ? ' shared' : '') });
          td.appendChild(inp);
          if (mark) {
            const who2 = (mark.others || []).map(function (o) {
              return o[2] || String(o[1]); }).join(', ');
            td.appendChild(el('span', { class: 'pill retro', text: 'shared',
              title: mark.target + ' is shared with ' + who2 + '. Editing this '
                     + 'cell points the row at a different ' + mark.column
                     + ' — it does not change what ' + mark.target + ' does, and '
                     + 'no sheet can. ' + mark.note }));
          }
          tr.appendChild(td);
          continue;
        }
        const kids = [];
        if (cell) kids.push(document.createTextNode(cell));
        // A BLANK IS NOT AN ABSENCE OF INFORMATION. The sheet states what the
        // game ships in the row's own comment, so a blank cell shows that
        // value greyed rather than nothing at all — an empty box and "ships
        // 130, untouched" look identical otherwise. This is still how a cell
        // that takes no edit is drawn; where a box IS offered the same words
        // are the box's placeholder, so they are never lost.
        else if (ship !== undefined)
          kids.push(el('span', { class: 'small', text: 'ships ' + ship }));
        else kids.push(el('span', { class: 'small', text: '—' }));
        if (mark) {
          const who = (mark.others || []).map(function (o) {
            return o[2] || String(o[1]); }).join(', ');
          // THE SAME FACTS, HALF THE WORDS AND NO SHOUTING. This tooltip was
          // written as a maintainer arguing with a future maintainer -- "This
          // cell is a REPOINT", then two clauses defending the claim -- and it
          // ran past 330 characters on every shared cell. What a reader needs
          // is what the cell does when they type in it. Nothing is dropped:
          // who else points at the row, that editing repoints rather than
          // edits, that neither sheet can make the two diverge, and the
          // server's own note are all still here.
          kids.push(el('span', { class: 'pill retro', text: 'shared',
            title: mark.target + ' is shared with ' + who + '. Editing this '
                   + 'cell points the row at a different ' + mark.column
                   + ' — it does not change what ' + mark.target + ' does, and '
                   + 'no sheet can. ' + mark.note }));
        }
        tr.appendChild(el('td', { class: 'ro' + (mark ? ' shared' : '') }, kids));
      }
      for (const v of ctlCols)
        tr.appendChild(el('td', { class: 'ro' + (v.flat ? ' constant' : ''),
                                  text: r.cells[v.i] || '' }));
      tb.appendChild(tr);
    }
  }
  tbl.appendChild(tb);
  wrap.appendChild(tbl);
  block.appendChild(wrap);
  // STAYS ON SCREEN: an expander mark, and the warning that shared-row marking
  // could not run at all.
  //
  // A mark is one short pill per sheet and a `blocking` one says a rule did
  // not land -- that is not a footnote. `sharedSource` is the instrument
  // reporting its own silence: without it, a sheet with unmarked shared rows
  // and a sheet the marker never examined look identical, which is the exact
  // mistake the sentence was written to stop. Neither goes behind a click.
  for (const m of (ov.expanderMarks || [])) {
    block.appendChild(el('div', { class: 'legend' }, [
      el('span', { class: 'pill ' + (m.kind === 'blocking' ? 'retro' : 'na'),
                   text: m.kind }),
      document.createTextNode('  ' + m.note)]));
  }
  if (ov.sharedSource) {
    block.appendChild(el('div', { class: 'legend', text:
      'Shared rows are not marked in this build (' + ov.sharedSource
      + '). An unmarked row here means the check did not run, not that nothing '
      + 'is shared.' }));
  }

  // GOES BEHIND ONE CLICK: the sheet's own notes, the shared-row explanation,
  // the column shape, and where the reference columns came from. All of it is
  // about the table above and none of it changes while you read it; it is a
  // reference, not a message, and 517 of these lines across the config is what
  // made the page unreadable.
  const notes = [];
  notes.push(el('div', { class: 'legend', text:
    'Shape: ' + shape + ' '
    + (canWrite
        ? nEdit + ' of its column(s) take an edit; the key, the identity '
          + 'columns and the control columns do not. The server decides which, '
          + 'per column, and this page asks it rather than judging a name.'
        : 'It takes no edit at all: ' + (ov.writableWhy || 'no reason given'))
    + ' Nothing here is validated against a schema — check_schema.py declares '
    + 'no columns for the lever sheets.' }));
  // COLLAPSED COLUMNS ARE NAMED, COUNTED AND RESTORABLE. Hiding is never
  // dropping: every one of these is still in the payload, still in the working
  // copy, and still written by a save — this fold is the whole of what was
  // taken off the screen, and the button puts it back. Same standard as
  // AXIS_WINDOWS in serve.py, which draws a windowed-out column anyway when a
  // row occupies it and says why.
  // EACH COLLAPSED COLUMN GETS THE REASON THAT APPLIES TO IT. Until
  // 2026-09-14 there was one reason and one sentence, and the button said "N
  // column(s) that never change". A second, unrelated reason landed that day —
  // five columns hidden by name because they are item metadata — and saying
  // "never changes" about one of those would be telling the reader something
  // false about a column that may well change. So the sentence branches on the
  // reason, the button counts both and claims neither, and a column hidden for
  // both reasons is named once, under the declared one, because that is the
  // one that would still hide it if every cell differed.
  if (collapsed.length) {
    for (const v of collapsed) {
      if (v.hidden) {
        notes.push(el('div', { class: 'legend', text:
          'Hidden: ' + v.c.name + ' — ' + v.role + ', '
          + (editableAt(v.i) ? 'editable' : 'not editable')
          + '. Hidden by name, not because of what it holds: ' + v.hidden
          + '. It is still in the file and still in the save; only the column '
          + 'is off the screen.' }));
        continue;
      }
      const k = (ov.constant || [])[v.i] || {};
      notes.push(el('div', { class: 'legend', text:
        'Collapsed: ' + v.c.name + ' — ' + v.role + ', '
        + (editableAt(v.i) ? 'editable' : 'not editable') + ', holds '
        + (k.value === '' ? 'nothing at all' : k.value)
        + ' on all ' + (k.rows === undefined ? ov.rows.length : k.rows)
        + ' row(s). It is still in the file and still in the save; only the '
        + 'column is off the screen.' }));
    }
    const nHid = collapsed.filter(function (v) { return !!v.hidden; }).length;
    const nFlat = collapsed.length - nHid;
    notes.push(el('button', {
      class: 'colbtn',
      // Says which kinds are in the count, so the button and the sentences
      // above it cannot disagree about why anything is off the screen.
      text: (shown ? 'Collapse ' : 'Show ') + collapsed.length + ' column(s) '
            + (nHid && nFlat ? 'hidden by name or unchanging'
               : nHid ? 'hidden by name' : 'that never change'),
      onclick: function () { OV_SHOWN[rel] = !shown; render(); },
    }));
  }
  if (ref) {
    notes.push(el('div', { class: 'legend', text:
      'The ' + refCols.map(function (c) { return c.name; }).join(' and ')
      + ' column(s) come from the schema, which carries a row per id with the '
      + 'value the game ships. They are not in the file and are not written. '
      + 'Signs are shown as the game ships them, not normalised.' }));
  }
  if (ov.sharedBlind)
    notes.push(el('div', { class: 'legend', text: ov.sharedBlind }));
  for (const n of (ov.notes || []))
    notes.push(el('div', { class: 'legend', text: n }));
  const disc = disclosure('Notes on this sheet', notes);
  if (disc) block.appendChild(disc);
  return block;
}

function fieldBlock(sch, f) {
  const ui = f.ui || 'form';
  const block = el('div', { class: 'field', style: 'grid-template-columns:1fr' });
  block.appendChild(el('div', {}, [
    el('label', { class: 'lab' }, [
      document.createTextNode((f.label || f.path) + '  '),
      el('span', { class: 'pill na', text: ui }),
      pathCode(sch, f),
    ]),
    f.docText ? el('div', { class: 'doc', text: f.docText }) : null,
  ].concat(docBitNodes(f))));

  if (ui === 'matrix') {
    block.appendChild(matrixFor(sch, f, {}));
  } else if (ui === 'curve') {
    const chart = chartFor(sch, f, function () { render(); });
    const grid = gridFor(sch, f, { onchange: function () { chart.__redraw(); } });
    block.appendChild(chart);
    block.appendChild(grid);
  } else {
    // A readonly table that some control declares as its underlay is drawn as
    // that control's own grid, on the same axes, so the two can be read across.
    const owner = ownerOf(sch, f);
    block.appendChild(owner
      ? matrixFor(sch, f, { readonly: true, owner: owner })
      : gridFor(sch, f, { readonly: ui === 'readonly' }));
    const ref = referenceFor(sch, f);
    if (ref) block.appendChild(ref);
  }
  return block;
}

// ONE CONTROL THAT SHOWS THE STATE AND SETS IT. The subsystem's gate, drawn
// once, in the header card, directly under the title.
//
// WHAT THIS REPLACES, and why — David, 2026-09-14, having opened the editor in
// a browser: "The 'On' and 'true' checkbox sections are functionally
// duplicates: They both talk about whether or not a section is on. Combine
// them." He was looking at ONE FACT RENDERED THREE TIMES, twice in one card
// and once in another:
//
//   1. a pill in the <h3> reading on / off / always on / off (master), read
//      off the enable index the SERVER computed at load;
//   2. an "enable chain: Slices.X = true" meta line under it, also server-side;
//   3. down in the body card, an ordinary field row: a checkbox labelled
//      "Enable <title>", ticked, with "default true" under it, read off the
//      WORKING copy.
//
// 1 and 3 could disagree, and did: the pill reads what was on disk at load and
// the box reads the working copy, so between an unsaved flip and a save the
// page said "on" beside a box that was not ticked. Merging them is not only
// tidying — it removes a state in which the page contradicts itself.
//
// WHAT SURVIVES, each of it written after something went wrong:
//   - THREE STATES. gateBox: checked on, unchecked off, indeterminate COULD
//     NOT BE READ. The word beside the box says which, in the same vocabulary
//     the nav and the chain use.
//   - THE ENABLE CHAIN AND ITS REASON, kept as its own line. It is not the
//     same statement as the box: the box is this slice's own key, the chain is
//     every gate between the key and the code running.
//   - gatedByMaster STAYS A SEPARATE PILL. The master returning out of
//     Plugin.Load() before the subsystem initialises is a DIFFERENT FACT from
//     this slice's key being false, and a page that showed one control for
//     both would be unable to say which had happened. The box still shows the
//     slice's own key, which is what a save would write.
//   - ALWAYS ON. A schema declaring no `enable` gets no box — gateBox returns
//     null — and a pill plus a sentence instead, rather than a dead checkbox.
//   - THE LINKED-GATE MACHINERY. The change handler is setBool, unchanged and
//     shared with the nav, so linkedEnable groups still move together and
//     requiresBlockers still refuses a flip that would strand a dependent.
function gateControl(sch, ent) {
  const g = gateBox(sch);
  const row = el('div', { class: 'field gate' });
  const lab = el('label', { class: 'lab' });
  if (g) {
    g.cb.addEventListener('change', function () { setBool(sch, g.f, g.cb.checked); });
    lab.appendChild(g.cb);
    lab.appendChild(document.createTextNode(' '));
    lab.appendChild(el('span', {
      class: 'pill ' + (g.unreadable ? 'unknown' : (g.cb.checked ? 'on' : 'off')),
      text: g.state }));
    lab.appendChild(document.createTextNode(' '));
    lab.appendChild(pathCode(sch, g.f));
  } else {
    lab.appendChild(el('span', { class: 'pill na', text: 'always on' }));
  }
  row.appendChild(lab);
  const right = el('div', {});
  if (!g) {
    right.appendChild(el('div', { class: 'meta', text:
      'This page declares no switch, so nothing here can be turned off. It is '
      + 'applied whenever the mod is.' }));
  }
  // The master is a different statement and gets its own mark. It does not
  // move the box: the box is this page's own key, which is what a save writes.
  if (ent && ent.gatedByMaster) {
    right.appendChild(el('div', {}, [
      el('span', { class: 'pill off', text: 'off (master)' }),
      document.createTextNode(' '),
      el('span', { class: 'small', text:
        'the master switch is off, so this page is not applied whatever this '
        + 'box says' }),
    ]));
  }
  if (ent && (ent.gates.length || ent.blocks.length)) {
    right.appendChild(el('div', { class: 'meta', text: 'enable chain: '
      + ent.gates.concat(ent.blocks).map(function (x) {
          return x.name + ' = ' + (x.state === null ? '?' : x.state);
        }).join('  AND  ')
      + (ent.gatedByMaster ? '   (and ' + MODEL.masterKey + ' = false, which returns out of '
         + 'Plugin.Load() before any subsystem is initialised)' : '') }));
  }
  if (g) {
    // NOT TWICE. The gate field's own help and the subsystem's uiDoc are the
    // same sentence on every slice schema in the live config — the schema
    // generator writes one string into both — and until they were brought into
    // one card that was invisible, because one was in the header and one was a
    // card below. Combining the controls made it a stutter three lines apart,
    // which is the same complaint one level down. The paragraph already
    // printed above wins; anything the field says beyond it still prints.
    const said = docParas(sch);
    if (g.f.docText && said.indexOf(g.f.docText) < 0)
      right.appendChild(el('div', { class: 'doc', text: g.f.docText }));
    for (const m of docBitNodes(g.f)) right.appendChild(m);
    // Said here and nowhere else now. The key not being in the file is exactly
    // the indeterminate state above, so the pill and this line are two halves
    // of one sentence rather than two claims.
    if (g.f.in === 'cfg' && g.unreadable) {
      right.appendChild(el('div', { class: 'meta', text:
        'not in the file yet — saving adds it' }));
    }
  }
  row.appendChild(right);
  return row;
}

// One subsystem's header and controls. A section holds one of these, or two.
function renderSubsystem(p, sch, fields) {
  const ent = entryOf(sch.subsystem);
  const head = el('div', { class: 'card' }, [
    el('h3', { text: sch.title || sch.subsystem }),
  ]);
  for (const para of docParas(sch)) head.appendChild(el('p', { class: 'doc', text: para }));
  head.appendChild(gateControl(sch, ent));
  p.appendChild(head);

  const gateField = gateFieldOf(sch);
  const body = el('div', { class: 'card' });
  let any = false;
  for (const f of fields) {
    const ui = f.ui || 'form';
    if (ui === 'hidden') continue;
    // The gate is drawn once, in the header card above. It used to be drawn
    // there AND here, which is the duplication this change removes.
    if (gateField && f === gateField) continue;
    any = true;
    if (ui === 'form') { body.appendChild(fieldRow(sch, f)); continue; }
    body.appendChild(fieldBlock(sch, f));
  }
  // The files this slice owns, under the same header and the same toggle.
  // Flipping the gate off skips all of them: Overlays.Load asks
  // Slices.VerdictForOverlay per file BEFORE it opens it, so a file whose
  // slice is off is never read.
  const ovs = overlaysOf(sch);
  for (const rel of ovs) { any = true; body.appendChild(overlayBlock(sch, rel)); }
  if (any) p.appendChild(body);
}

function renderPanel() {
  const p = $('#panel');
  p.textContent = '';
  const sec = sectionOf(SEL);
  if (!sec) return;
  const schs = schemasOf(sec);
  if (!schs.length) return;

  if (schs.length > 1) {
    // WAS, until 2026-09-13: "Two pages, shown together because they are two
    // halves of one question." A section could only ever hold two subsystems
    // then. It can now hold as many as its group declares, so the count is
    // counted rather than spelled.
    p.appendChild(el('div', { class: 'card' }, [
      el('h3', { text: sec.title }),
      el('p', { class: 'doc', text:
        schs.length + ' pages, shown together because they are parts of one '
        + 'question. Each keeps its own switch and its own file, and they are '
        + 'set independently.' }),
    ]));
  }

  // Reference material goes to the end of the section, after every control it
  // is a reference for — including the other subsystem's.
  const reference = [];
  for (const sch of schs) {
    const split = CKF.splitReference(sch.fields);
    renderSubsystem(p, sch, split.main);
    // A reference field whose rows are already drawn beside an overlay's is
    // not drawn a second time in the reference card. Seventy-six rows twice on
    // one page is not a reference, it is noise.
    const joined = overlaysOf(sch).map(function (rel) {
      return referenceAnnotating(sch, overlayEntry(rel)); }).filter(Boolean);
    for (const f of split.reference)
      if (joined.indexOf(f) < 0) reference.push({ sch: sch, field: f });
  }
  if (reference.length) {
    const card = el('div', { class: 'card' }, [el('h3', { text: 'For reference' })]);
    for (const r of reference) card.appendChild(fieldBlock(r.sch, r.field));
    p.appendChild(card);
  }
}

// ---------------------------------------------------------------------------

function updateDirty() {
  const d = dirtyPaths();
  $('#dirty').textContent = d.length
    ? d.length + ' change(s) pending'
    : 'no changes';
  $('#save').disabled = !d.length
    || MODEL.probe.config.state === 'missing' || !MODEL.check.ran;
}

function render() {
  renderBanners();
  renderIndex();
  renderPanel();
  updateDirty();
}

function renderProbe() {
  const p = MODEL.probe.config;
  const cls = p.state === 'ok' ? 'on' : (p.state === 'missing' ? 'unknown' : 'off');
  $('#probe').textContent = '';
  $('#probe').appendChild(el('span', { class: 'pill ' + cls,
    title: p.detail || '', text: 'config ' + p.state }));
}

async function load() {
  MODEL = await api('/api/model');
  W = buildWorking();
  // Both belong to one working copy. A fresh read is a fresh copy, and after a
  // save the server's own notes (LAST_SAVE.notes) are the record of what it
  // wrote — keeping these would show the same fact twice, in the past tense.
  REQ_NOTES = [];
  REQ_REFUSAL = null;
  // REMOVED 2026-09-07: `RETRO_OK = {}`. It was the per-field acknowledgement
  // map behind the retroactive confirm-before-saving gate, which 3.0 deleted --
  // `retroactive` is data, not a warning. The write outlived both its
  // declaration and its only reader, and under 'use strict' an assignment to an
  // undeclared name is a ReferenceError, so load() threw here on every start.
  if (!SEL || !sectionOf(SEL)) SEL = MODEL.sections[0].id;
  $('#gamedir').value = MODEL.configDirOverride || MODEL.gameDir || '';
  renderProbe();
  render();
}

$('#applydir').addEventListener('click', async function () {
  const v = $('#gamedir').value.trim();
  const body = /bepinex[\\/]+config[\\/]*$/i.test(v)
    ? { configDirOverride: v } : { gameDir: v, configDirOverride: null };
  MODEL = await api('/api/settings', body);
  W = buildWorking();
  renderProbe();
  render();
});

$('#revalidate').addEventListener('click', async function () {
  const r = await api('/api/validate', { edits: buildEdits() });
  LAST_SAVE = null;
  const lines = [];
  if (r.refused) lines.push(r.refused.summary, r.refused.detail);
  if (r.check && !r.check.ran) lines.push('check_schema could not run: ' + r.check.error);
  for (const p of ((r.check && r.check.problems) || [])) lines.push(p.kind + '  ' + p.message);
  for (const n of (r.notes || [])) lines.push(n);
  if (r.wouldWrite) lines.push('would write: ' + r.wouldWrite.join(', '));
  const box = $('#banners');
  render();
  box.insertBefore(banner(r.ok ? 'ok' : 'err',
    r.ok ? 'Validated — nothing blocking' : 'Validation found blocking problems',
    lines.filter(Boolean)), box.firstChild);
});

$('#save').addEventListener('click', async function () {
  $('#save').disabled = true;
  try {
    // fingerprints prove the save is written against the bytes this page was
    // shown. Row identity is positional; a file edited on disk underneath us
    // would otherwise reattach preserved keys to the wrong row.
    LAST_SAVE = await api('/api/save',
      { edits: buildEdits(), fingerprints: MODEL.fingerprints });
  } catch (e) {
    LAST_SAVE = { ok: false, refused: { summary: 'the request failed', detail: String(e) } };
  }
  const keep = LAST_SAVE;
  await load();
  LAST_SAVE = keep;
  render();
});

load().catch(function (e) {
  $('#banners').appendChild(banner('err', 'Could not load the config', [String(e)]));
});
</script>
</body>
</html>

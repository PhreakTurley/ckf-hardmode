<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CKF Hard Mode — config</title>
<style>
:root{
  --bg:#14161a; --panel:#1c1f25; --panel2:#22262e; --line:#31363f;
  --ink:#e6e8ec; --dim:#9aa1ad; --faint:#6b7280;
  --on:#3ea76a; --off:#7b8494; --unknown:#c9973f; --danger:#d0564a;
  --accent:#5b8dd6; --unsetbg:#20242c;
  /* The sticky header's height, in one place. It was written as a bare 58px in
     three rules (nav top, nav max-height, main min-height) and they had to be
     kept in step by hand; the density pass changed the header and would have
     had to change all three. */
  --hh:44px;
}
/* DENSITY. One window, one user, tabular numeric data, long sessions: width
   for the grids is worth more than whitespace. The type scale used to start at
   16.25px with a 338px nav; at a laptop width that left a 24-column table
   scrolling sideways inside a pane narrower than the table. Base is 14.5px and
   the nav is 244px, which is ~110px of grid back on every page. Nothing was
   removed to get it -- the same rows are drawn, in less room. */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);
  font:14.5px/1.45 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif}
code,.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:20;background:var(--panel);
  border-bottom:1px solid var(--line);padding:7px 14px;display:flex;gap:10px;
  align-items:center;flex-wrap:wrap}
header h1{font-size:15px;margin:0 10px 0 0;font-weight:600;letter-spacing:.2px}
header input[type=text]{width:min(44ch,32vw)}
input,select,button,textarea{font:inherit;color:var(--ink);background:var(--panel2);
  border:1px solid var(--line);border-radius:5px;padding:3px 7px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
button{cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:#2c4c78;border-color:#3d6396}
button.warn{background:#4a2320;border-color:#7d3a34}
main{display:flex;align-items:flex-start;gap:0;min-height:calc(100% - var(--hh))}
nav{width:244px;flex:0 0 244px;border-right:1px solid var(--line);
  padding:8px 0;position:sticky;top:var(--hh);max-height:calc(100vh - var(--hh));
  overflow:auto}

/* THE NAV ROW READS NAME FIRST.
   It used to be built as togs.concat([title]).concat(pills) -- every gate
   checkbox of the section, THEN the name. A section of 12 slices therefore
   drew 12 unlabelled boxes before its title and pushed the title off the right
   edge of a 338px nav [measured off SECTION_GROUPS, 2026-09-14: 12 for
   Cyberware, 6 for Consumables]. The name is what the row is FOR, so it is
   first and it is the element that gets the leftover width; every control
   after it is fixed-width and cannot displace it. */
nav .navitem{display:flex;gap:7px;align-items:center;padding:4px 6px 4px 11px;
  cursor:pointer;border-left:3px solid transparent;min-width:0}
nav .navitem:hover{background:var(--panel)}
nav .navitem.sel{background:var(--panel);border-left-color:var(--accent)}
nav .navitem .nm{flex:1 1 auto;min-width:0;overflow:hidden}
nav .navitem .nm b{display:block;font-weight:600;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
nav .navitem .tog{flex:0 0 auto;margin:0}
nav .navitem .pill{flex:0 0 auto}

/* The per-slice gates of a multi-slice section, folded into the row.
   They are still one checkbox per slice, in declaration order, still inside
   the nav item -- what changed is that they are behind a summary instead of
   ahead of the name. Closed, the row is one line; open, each gate is beside
   the slice's own name and state, which the bare boxes never were. */
nav details.gates{flex:0 0 auto;min-width:0}
nav details.gates>summary{list-style:none;cursor:pointer;font-size:11.5px;
  padding:1px 6px;border:1px solid var(--line);border-radius:9px;
  color:var(--dim);white-space:nowrap;background:var(--panel2)}
nav details.gates>summary::-webkit-details-marker{display:none}
nav details.gates>summary:hover{border-color:var(--accent);color:var(--ink)}
nav details.gates[open]>summary{border-color:var(--accent)}
nav details.gates .gaterow{display:flex;gap:6px;align-items:center;
  padding:2px 0 2px 2px;font-size:12.5px;color:var(--dim)}
nav details.gates .gaterow .gn{flex:1 1 auto;min-width:0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
nav details.gates .gatelist{padding:4px 0 6px}
nav .navgroup{padding:11px 11px 3px;font-size:11px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
nav .navnote{padding:1px 11px 6px;font-size:11.75px;color:var(--faint);
  line-height:1.35}
section#panel{flex:1;min-width:0;padding:12px 16px 80px}
@media (max-width:1180px){
  nav{width:208px;flex:0 0 208px}
  section#panel{padding:10px 11px 80px}
}
.pill{font-size:11.25px;padding:1px 7px;border-radius:10px;border:1px solid;
  white-space:nowrap;letter-spacing:.3px;text-transform:uppercase}
.pill.on{color:var(--on);border-color:var(--on)}
.pill.off{color:var(--off);border-color:var(--off)}
.pill.unknown{color:var(--unknown);border-color:var(--unknown)}
.pill.na{color:var(--faint);border-color:var(--faint)}
.pill.retro{color:var(--danger);border-color:var(--danger)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:7px;
  padding:10px 13px;margin:0 0 10px}
.card>h3{margin:0 0 4px;font-size:15px;display:flex;gap:8px;align-items:center;
  flex-wrap:wrap}
.doc{color:var(--dim);margin:6px 0 0;font-size:13.5px;max-width:96ch}
p.doc{margin:6px 0 0}
p.doc+p.doc{margin-top:7px}
.meta{color:var(--faint);font-size:12.25px;margin-top:4px;max-width:110ch}
.field{display:grid;grid-template-columns:20ch 1fr;gap:11px;padding:7px 0;
  border-top:1px solid var(--line)}
.field:first-of-type{border-top:0}
.field.disabled{opacity:.5}
.field label.lab{font-weight:600}
.field label.lab code{display:block;color:var(--faint);font-weight:400;font-size:12.25px}
/* The subsystem gate, merged 2026-09-14 out of a pill, a chain line and a
   checkbox row. It sits at the top of the header card and is the most
   consequential control on the page, so it gets a wider label column than an
   ordinary lever and its box and state word sit on one line. */
.field.gate{grid-template-columns:24ch 1fr;align-items:start;border-top:0;
  margin-top:6px;padding-top:9px;border-top:1px solid var(--line)}
.field.gate label.lab{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.field.gate label.lab code{flex:0 0 100%}
code.loc span{display:block}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner{border-radius:7px;padding:8px 12px;margin:0 0 10px;border:1px solid}
.banner.err{background:#2a1614;border-color:#7d3a34}
.banner.warn{background:#2b2415;border-color:#7d6534}
.banner.ok{background:#152418;border-color:#2f6b46}
.banner.info{background:#161d29;border-color:#33507d}
.banner h4{margin:0 0 4px;font-size:13.75px}
.banner ul{margin:4px 0 0;padding-left:20px}
.retrobox{border:2px solid var(--danger);border-radius:7px;padding:10px 12px;
  background:#241715;margin:8px 0}
.retrobox h4{margin:0 0 4px;color:#f0a196;font-size:13.75px}
.grid-wrap{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:6px}
table.grid{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
table.grid th,table.grid td{border-bottom:1px solid var(--line);
  border-right:1px solid var(--line);padding:0;white-space:nowrap}
table.grid th{position:sticky;top:0;background:var(--panel2);z-index:2;
  padding:4px 7px;text-align:left;font-size:12.25px;font-weight:600;
  white-space:normal;overflow-wrap:anywhere;line-height:1.2;vertical-align:bottom;
  max-width:16ch}
table.grid th.axis{left:0;z-index:3}
table.grid td.axis{position:sticky;left:0;background:var(--panel2);
  padding:3px 7px;font-weight:600;z-index:1}
table.grid td{font-size:13px}
table.grid td.ro{padding:3px 7px}
table.grid td input{border:0;border-radius:0;background:transparent;width:11ch;
  padding:3px 7px}
table.grid td.unset input{background:var(--unsetbg)}
table.grid td.unset{background:
  repeating-linear-gradient(135deg,transparent,transparent 5px,#282d36 5px,#282d36 6px)}
table.grid td.bad input{background:#3a1d1a;color:#ffb4aa}
table.grid td.inherit input{color:var(--faint);font-style:italic}
table.grid td.setcell input{color:#8fd1a5;font-weight:600}
table.grid tr:hover td{background-color:#1f232a}
.rowbtn{border:0;background:transparent;color:var(--dim);padding:2px 7px}
.rowbtn:hover{color:var(--danger)}
.legend{color:var(--faint);font-size:12.25px;margin:6px 0 0;max-width:110ch}
.legend .sw{display:inline-block;width:12px;height:12px;vertical-align:-1px;
  margin-right:5px;border:1px solid var(--line)}
.legend .sw.unset{background:
  repeating-linear-gradient(135deg,transparent,transparent 5px,#282d36 5px,#282d36 6px)}

/* DISCLOSURE. The house rule is "hiding is never dropping": everything a
   <details> closes is still in the page and still in its text, one click away
   and searchable by the browser's own find. It exists because the notes a
   sheet carries are per-column-PAIR and therefore quadratic -- one sheet ships
   81 of them and one section 89, 98,113 characters of note text across 53
   sheets, 76% of every word on the page [measured off the live config,
   2026-09-14]. Stacked as 517 loose lines they buried the grids they annotate.
   Nothing was cut from the schema or from the server payload. */
details.disc{margin:6px 0 0}
details.disc>summary{cursor:pointer;color:var(--dim);font-size:12.25px;
  list-style:none;display:inline-flex;gap:6px;align-items:center;
  padding:2px 8px;border:1px solid var(--line);border-radius:5px;
  background:var(--panel2)}
details.disc>summary::-webkit-details-marker{display:none}
details.disc>summary::before{content:'▸';font-size:10px;color:var(--faint)}
details.disc[open]>summary::before{content:'▾'}
details.disc>summary:hover{border-color:var(--accent);color:var(--ink)}
details.disc .discbody{padding:6px 0 2px 10px;border-left:2px solid var(--line);
  margin-top:6px}
details.disc .discbody .legend{margin:0 0 5px}
details.disc .discbody .legend:last-child{margin-bottom:0}

/* WAS "SEAM, not yet wired" until 2026-09-14. The second wave landed: overlay
   lever cells carry inputs and a column that holds one value across every row
   is collapsed. Both rules below are now set -- `editable` on a lever cell's
   own td, `constant` on the header and cells of a collapsed column that the
   reader has put back. The comment is kept because it is the record of why
   these two rules existed before anything used them. */
table.grid td.editable input{background:var(--panel2)}
table.grid th.constant,table.grid td.constant{opacity:.62}
/* A DIRTY CELL IS A STRIPE, NOT A BADGE. It has to survive a re-render and be
   visible at a glance down a 24-column grid, and it may not be an element: the
   variant-pairing case asserts that a row outside the variant family carries no
   pill, so anything added inside a <tr> risks reading as one. A class on the td
   is neither. */
table.grid td.dirty input{background:#1d3350;box-shadow:inset 3px 0 0 var(--accent)}
/* The cell a refusal named. Distinct from `bad` (which this page decided) so
   that "the server said no to THIS cell" and "this does not parse" do not wear
   the same colour. */
table.grid td.refused input{background:#3a1d1a;color:#ffb4aa;
  box-shadow:inset 3px 0 0 var(--danger)}
table.grid td.editable input::placeholder{color:var(--faint);font-style:italic}
.colbtn{font-size:12.25px;padding:2px 8px;margin:2px 0}
.chart{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
  margin:10px 0}
.chart svg{display:block;width:100%;height:280px;touch-action:none}
.series{display:flex;gap:13px;flex-wrap:wrap;padding:6px 11px;font-size:12.5px}
.series label{display:flex;gap:5px;align-items:center;cursor:pointer}
.problem{font-size:13.5px;margin:2px 0}
.problem b{display:inline-block;width:9ch}
.spacer{flex:1}
.tools{display:flex;gap:8px;align-items:center}
.chk{display:flex;gap:6px;align-items:center}
.hidden{display:none}
.small{font-size:12.5px;color:var(--dim)}
.kbd{border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:12.25px}
</style>
</head>
<body>

<header>
  <h1>CKF Hard Mode — config</h1>
  <label class="small" for="gamedir">Game directory</label>
  <input type="text" id="gamedir" spellcheck="false">
  <button id="applydir">Apply</button>
  <span id="probe"></span>
  <span class="spacer"></span>
  <span id="dirty" class="small"></span>
  <button id="revalidate">Validate</button>
  <button id="save" class="primary">Save</button>
</header>

<div id="banners" style="padding:10px 16px 0"></div>

<main>
  <nav id="index"></nav>
  <section id="panel"></section>
</main>

<script>
/*==CKF-PURE-BEGIN==*/
/* Pure functions: no DOM, no network, no globals beyond CKF.
   serve.py --selftest-js extracts exactly this region and runs it under node.
   Keep anything that touches document/fetch OUTSIDE the sentinels. */

const CKF = (function () {

  // A transcription of MissionRewards.cs:391-414 (Adjust.Parse).
  //   ""  none | "=N" / "N" set | "+N" add | "-N" add, sign kept
  //   "xN" / "XN" / "*N" multiply
  // The body is parsed as NumberStyles.Float, InvariantCulture: leading sign,
  // decimal point and exponent allowed; group separators are not. An
  // unparseable spec is logged and ignored by the plugin -- a silent no-op --
  // so the GUI treats it as an error rather than letting it through.
  const NUM = /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?$/;

  function parseAdjust(spec) {
    const s = (spec == null ? '' : String(spec)).trim();
    if (s === '') return { kind: 'none', value: null, ok: true };
    let kind = 'set', body = s;
    const c = s[0];
    if (c === '=') { kind = 'set'; body = s.slice(1); }
    else if (c === 'x' || c === 'X' || c === '*') { kind = 'multiply'; body = s.slice(1); }
    else if (c === '+') { kind = 'add'; body = s.slice(1); }
    else if (c === '-') { kind = 'add'; body = s; }
    body = body.trim();
    if (!NUM.test(body)) return { kind: 'none', value: null, ok: false };
    const v = Number(body);
    if (!isFinite(v)) return { kind: 'none', value: null, ok: false };
    return { kind: kind, value: v, ok: true };
  }

  function describeAdjust(spec) {
    const r = parseAdjust(spec);
    if (!r.ok) return 'unparseable — the plugin logs a warning and ignores it';
    if (r.kind === 'none') return 'no change';
    if (r.kind === 'set') return 'set to ' + r.value;
    if (r.kind === 'add') return (r.value < 0 ? 'subtract ' + (-r.value) : 'add ' + r.value);
    return 'multiply by ' + r.value;
  }

  // The string that goes on the right of '=' in the .cfg. Never a comment.
  function renderCfgValue(type, value) {
    if (type === 'bool') return value ? 'true' : 'false';
    if (type === 'int') return String(Math.trunc(Number(value)));
    if (type === 'float' || type === 'floatOrNaN') {
      if (value === 'NaN' || (typeof value === 'number' && isNaN(value))) return 'NaN';
      const f = Number(value);
      if (f === Math.trunc(f) && Math.abs(f) < 1e15) return String(Math.trunc(f));
      return String(f);
    }
    if (type === 'stringList') {
      const items = Array.isArray(value)
        ? value.map(function (s) { return String(s).trim(); })
        : String(value == null ? '' : value).split(',').map(function (s) { return s.trim(); });
      return items.filter(function (s) { return s !== ''; }).join(', ');
    }
    return value == null ? '' : String(value);
  }

  // A cell's text -> {present, value, ok}. UNSET IS NOT ZERO: for a numeric
  // cell an empty box means the key is absent on disk, and "0" means the key
  // is there with the value zero. For a string cell an empty box is a real
  // empty string -- "" is a meaningful adjustment spec -- so a string is only
  // unset through the explicit unset button, which sends null.
  function coerceCell(type, text) {
    if (text === null) return { present: false, value: null, ok: true };
    const s = String(text);
    if (type === 'string' || type === 'stringList') {
      return { present: true, value: s, ok: true };
    }
    if (type === 'bool') {
      if (s.trim() === '') return { present: false, value: null, ok: true };
      return { present: true, value: (s === 'true' || s === true), ok: true };
    }
    if (s.trim() === '') return { present: false, value: null, ok: true };
    if (!NUM.test(s.trim())) return { present: true, value: null, ok: false };
    const n = Number(s.trim());
    if (type === 'int' && n !== Math.trunc(n)) return { present: true, value: null, ok: false };
    return { present: true, value: (type === 'int' ? Math.trunc(n) : n), ok: true };
  }

  function inRange(value, range) {
    if (!range || value == null) return true;      // unset is never out of range
    if (typeof value !== 'number' || isNaN(value)) return true;
    return value >= range[0] && value <= range[1];
  }

  // The AND-chain. A gate that could not be read is 'unknown', never 'off':
  // an instrument's silence is not evidence (AGENTS.md section 3).
  function effective(states) {
    if (!states.length) return 'n/a';
    if (states.some(function (s) { return s === false; })) return 'off';
    if (states.some(function (s) { return s == null; })) return 'unknown';
    return 'on';
  }

  // Points for the curve chart. A cell that is unset is not plotted -- the
  // line breaks -- which is how an absent key stays visibly different from a
  // zero sitting on the axis.
  function curvePoints(rows, xcol, ycol) {
    const out = [];
    for (const r of rows) {
      const x = r.cells[xcol], y = r.cells[ycol];
      if (typeof x !== 'number' || typeof y !== 'number') continue;
      out.push({ id: r.id, x: x, y: y });
    }
    out.sort(function (a, b) { return a.x - b.x; });
    return out;
  }

  // The row and column domains of a matrix: the union of what the override
  // holds and what the underlying stock table holds.
  function matrixDomain(overrideRows, stockRows, axes) {
    const rs = new Set(), cs = new Set();
    for (const src of [stockRows || [], overrideRows || []]) {
      for (const r of src) {
        const a = r.cells[axes.row], b = r.cells[axes.col];
        if (a != null) rs.add(Number(a));
        if (b != null) cs.add(Number(b));
      }
    }
    const num = function (a, b) { return a - b; };
    return { rows: Array.from(rs).sort(num), cols: Array.from(cs).sort(num) };
  }

  // RewardCurve.cs:249-251 -- `if (tier.X >= 0)`, and the Tier initialiser is
  // -1, so a column that is missing and a column that is negative both mean
  // "keep the game's number". Zero does not: zero is a real zero.
  function isKeepValue(v) {
    if (v == null) return true;
    return typeof v === 'number' && v < 0;
  }

  // The cells of a row the matrix editor adds for a brand new row or column.
  // Every column starts UNSET -- null, the same state clearing a cell leaves
  // behind -- and only the two axis coordinates are filled in.
  //
  // It must not be 0. `X && 0` used to put a real zero in the value column,
  // and teampl.override is one of the two retroactive fields in the mod:
  // Progression.Merged() consults Overrides before Cells, so a 0 there is an
  // award of zero rather than an inherit, and enabling Progression re-prices
  // every past mission at load with the substituted total persisting into the
  // save. Neither guard catches it -- 0 is inside the declared range and the
  // mirror faithfully agrees with its source -- so check_schema reports a
  // clean file.
  function newMatrixCells(rowCols, axes, which, value, firstRow, firstCol) {
    const cells = {};
    for (const col of (rowCols || [])) cells[col.name] = null;
    if (which === axes.row) { cells[axes.row] = value; cells[axes.col] = firstCol; }
    else { cells[axes.row] = firstRow; cells[axes.col] = value; }
    cells[axes.value] = null;
    return cells;
  }

  // REMOVED IN 3.0: pairState. Elapse and Fatigue used to be gated twice -- a
  // cfg key read before the sidecar was opened, the sidecar's own flag after it
  // loaded -- and one checkbox stood for both, with a 'mixed' state for the one
  // thing a single box cannot honestly render. Phase 3 deleted the outer cfg
  // gate, so no subsystem has two gates and there is no pair to collapse.

  // Reference material sorts after the controls it is a reference for. Keyed
  // off the `ui` value, which is the dispatch everywhere else in this page;
  // no field is named.
  function splitReference(fields) {
    const main = [], reference = [];
    for (const f of (fields || [])) ((f.ui === 'readonly') ? reference : main).push(f);
    return { main: main, reference: reference };
  }

  // Which coordinates of a matrix axis are drawn. A window narrows the grid to
  // the part anyone edits; a coordinate OUTSIDE the window is still drawn when
  // data occupies it, because hiding a cell that carries a value is how a save
  // silently drops it. `outside` names the ones drawn for that reason so the
  // page can say why they are there.
  function visibleAxis(values, win, occupied) {
    const occ = new Set((occupied || []).map(Number));
    const shown = [], hidden = [], outside = [];
    for (const v of (values || [])) {
      const inWin = !win || (v >= win[0] && v <= win[1]);
      if (inWin) { shown.push(v); continue; }
      if (occ.has(Number(v))) { shown.push(v); outside.push(v); }
      else hidden.push(v);
    }
    return { shown: shown, hidden: hidden, outside: outside };
  }

  // REMOVED, 2026-09-07: hasUnsetControl, and the explicit unset controls it
  // gated -- the per-cell null-set button and the document field's unset
  // toggle. David's ruling: editing the box is the whole gesture. Clearing a
  // numeric box still drops the key, which is what coerceCell above returns;
  // clearing a text box now leaves an empty string, which is a value the file
  // carries rather than a key it loses. The server side is untouched -- a null
  // cell in an edit payload still drops the key -- so a file that already has
  // an absent text key keeps it until someone types in that cell.

  function fmtCell(v) {
    if (v == null) return '';
    if (typeof v === 'boolean') return v ? 'true' : 'false';
    return String(v);
  }

  // A column heading with a break opportunity at each camelCase seam, so a
  // three-word heading wraps a word at a time rather than being chopped
  // mid-word. U+200B is zero width: the text a player copies out of a heading
  // is unchanged, and String.length is not what colWidth measures.
  const SEAM = /([a-z0-9])([A-Z])/g;

  function softWrap(name) {
    return String(name).replace(SEAM, '$1\u200b$2');
  }

  function headSegments(name) {
    return softWrap(name).split('\u200b');
  }

  // How wide a grid column's input should be, in ch.
  //
  // Every column used to be 11ch, or 20ch for a string, which is the whole
  // spacing complaint: the mission overrides' key column holds ids up to 46
  // characters and showed 20 of them, while the adjustment slots beside it
  // hold "x1.5" and were given 11. So the width comes from what the column
  // actually holds:
  //
  //   the longest value in it, plus one so the caret has somewhere to sit;
  //   a floor by kind, because an empty column still needs to be typed into;
  //   the longest heading segment, uncapped -- the heading is part of what the
  //     column has to hold, and the old 12ch cap let a heading set a width it
  //     then had to wrap out of;
  //   and a ceiling, because a 46-character id does not get a 47ch column.
  //
  // That total is the CONTENT. The column is then sized to 120% of it, so
  // nothing sits flush against a cell border, plus 2ch for the box's own
  // padding: `box-sizing:border-box` means a width in ch is the outside of the
  // input, and without that term the 120% is spent on padding and the text
  // ends up with the same room it had before.
  //
  // The heading is what a wrapping th contributes; the td stays nowrap, so the
  // column ends up as wide as this number and no wider.
  const WIDTH_MARGIN = 1.2;   // 120% of the widest thing in the column
  const WIDTH_PADDING = 2;    // ch, the input's own left+right padding
  function colWidth(col, values, fmt) {
    let longest = 0;
    for (const v of (values || [])) {
      const t = fmtCell(v);
      if (t.length > longest) longest = t.length;
    }
    const floor = fmt === 'adjust' ? 6
                : (col.type === 'string' || col.type === 'stringList') ? 8 : 4;
    let head = 0;
    for (const seg of headSegments(col.name)) if (seg.length > head) head = seg.length;
    const content = Math.max(longest + 1, floor, head);
    const w = Math.ceil(content * WIDTH_MARGIN) + WIDTH_PADDING;
    return Math.max(6, Math.min(w, 44));
  }

  function deepEqual(a, b) {
    if (a === b) return true;
    if (typeof a !== typeof b) return false;
    if (a === null || b === null) return false;
    if (Array.isArray(a)) {
      if (!Array.isArray(b) || a.length !== b.length) return false;
      for (let i = 0; i < a.length; i++) if (!deepEqual(a[i], b[i])) return false;
      return true;
    }
    if (typeof a === 'object') {
      const ka = Object.keys(a), kb = Object.keys(b);
      if (ka.length !== kb.length) return false;
      for (const k of ka) {
        if (!Object.prototype.hasOwnProperty.call(b, k)) return false;
        if (!deepEqual(a[k], b[k])) return false;
      }
      return true;
    }
    return false;
  }

  // -------------------------------------------------------------------------
  // LEVER SHEETS: which columns may be collapsed, and whether a cell parses.

  // WHICH COLUMNS A LEVER-SHEET GRID MAY COLLAPSE.
  //
  // David asked to "suppress any column that never changes within a table".
  // Taken literally against these sheets it hides most of the tool, and the
  // measurement is why. Of the 563 editable lever columns the live config
  // ships: 169 VARY, 3 are constant at a real value, and 391 are constant ONLY
  // BECAUSE EVERY CELL IN THEM IS BLANK. On 19 of the 53 sheets not one
  // editable column varies [measured off api_model, 2026-09-14].
  //
  // A blank override column is not "nothing to edit". It is NO OVERRIDE SET --
  // it is exactly the empty cell there was no way to type into, which is the
  // complaint this wave exists to answer. Collapsing those 391 would put 19
  // sheets back into that state, so the rule has three exceptions and each one
  // is a measurement, not a preference:
  //
  //   1. NEVER the key column. It is the row's name. On a one-row sheet it is
  //      "constant" by arithmetic, and collapsing it leaves a grid of nothing.
  //   2. NEVER a sheet with fewer than two rows. A column is constant across
  //      one row by definition; that is a tautology, not an observation about
  //      the data, and TalentModel.cs.csv (one row, one lever column, constant)
  //      would otherwise lose its only editable cell.
  //   3. NEVER an editable column whose one value is blank -- the 391 above.
  //
  // What is left, counted AFTER the three exceptions rather than before them:
  // 8 non-editable columns, EVERY ONE of them holding nothing at all, and 2
  // editable columns pinned at a real value. Ten columns in the shipped config
  // [measured off api_model, 2026-09-14].
  //
  // CORRECTION, 2026-09-14, left visible because the sentence contradicted its
  // own conclusion and still reached the right total, which is the shape of
  // wrongness that survives a proofread. This read: "a non-editable column
  // holding one value on every row (16 of them, 9 of which hold nothing at
  // all), and an editable column pinned at a REAL value on every row (3, of
  // which 2 are on sheets of two rows or more)". The 16, the 9 and the 3 are
  // the CANDIDATE set -- every constant column, before exceptions 1 and 2 run
  // -- not what survives them. Exception 2 removes 8 of the 16 non-editable
  // candidates (7 of them holding a real value, 1 holding nothing) and the
  // third real-valued editable candidate as well; all nine of those sit on the
  // two one-row sheets. Exception 1 removes nothing further on its own, because
  // the only constant key columns are on those same two sheets. So the
  // survivors are 8 and 2, and all 8 hold nothing -- not 9 of 16, and not 7.
  // The "(3, of which 2 ...)" clause was already right; its 2 is the 2 above.
  // The code was never wrong. Only the prose, which counted what the rule looks
  // at instead of what it keeps.
  //
  // COLLAPSING IS NOT DROPPING. The caller keeps every column in the model and
  // in the save; this only says which ones the grid need not draw, and the
  // grid names each one, with its value and its row count, in the sheet's own
  // notes -- and offers to put it back. Same standard as AXIS_WINDOWS in
  // serve.py: "a column outside the window that carries an override row is
  // drawn anyway and called out, and the save is built from every row the file
  // holds, not from what is on screen."
  function overlaySuppressed(entry) {
    const cols = (entry && entry.columns) || [];
    const out = cols.map(function () { return false; });
    const rows = (entry && entry.rows) || [];
    if (rows.length < 2) return out;                              // exception 2
    const con = (entry && entry.constant) || [];
    const ed = (entry && entry.editable) || [];
    for (let i = 1; i < cols.length; i++) {                       // exception 1
      const k = con[i];
      if (!k || typeof k.value !== 'string') continue;   // varies, or not sent
      if (ed[i] && k.value === '') continue;                      // exception 3
      out[i] = true;
    }
    return out;
  }

  // WHICH COLUMNS ARE HIDDEN BY NAME, AND WHY. -> [reason string | null]
  //
  // THE SECOND, INDEPENDENT REASON A COLUMN CAN BE OFF THE SCREEN, added
  // 2026-09-14: David asked for five named columns to be suppressed everywhere
  // they appear, because they are item metadata rather than combat levers.
  //
  // THE NAMES ARE NOT HERE AND MUST NOT COME HERE. This page names no column,
  // and two selftests keep that true. The names are a declared presentation
  // table in the server, beside the four that were already there, with the
  // measurement that justified each one; this reads the per-column reason the
  // server sends and does not know one name from another.
  //
  // IT IS NOT THE CONSTANCY RULE AND MUST NOT BE FOLDED INTO IT.
  //   - The constancy rule EXEMPTS a sheet of fewer than two rows, because
  //     every column of a one-row sheet is constant by arithmetic. This one has
  //     no row-count exemption: a declared hide says nothing about the cells,
  //     so it holds at one row exactly as at twenty-seven.
  //   - The two reasons get two sentences in the fold. Telling a reader that a
  //     column "never changes" when it was hidden for being metadata is a false
  //     statement they have no way to catch.
  //
  // HIDING IS STILL NOT DROPPING. Every column named here is in the payload, in
  // the working copy and in the save, is named with its reason in the sheet's
  // own notes, and the button puts it back.
  function overlayHidden(entry) {
    const cols = (entry && entry.columns) || [];
    const h = (entry && entry.hidden) || [];
    return cols.map(function (c, i) {
      const r = h[i];
      return (i > 0 && typeof r === 'string' && r) ? r : null;
    });
  }

  // WHETHER ONE PROPOSED LEVER CELL WILL SURVIVE THE SAVE.
  //
  // A transcription of serve.py's overlay_check_cell, so that a cell the server
  // is going to refuse is marked before the round trip rather than after it.
  // The server stays the authority: this refuses nothing and blocks nothing, it
  // only colours the box. Three outcomes, and the third is deliberately not an
  // error -- 11 of the 379 filled direct lever cells are IconPng strings, and
  // the server takes them with a named warning.
  //
  //   -> null      it parses
  //   -> {bad:..}  the server will refuse it
  //   -> {warn:..} the server will take it and say it checked nothing
  function overlayCellProblem(entry, ci, value) {
    if (typeof value !== 'string') return { bad: 'a cell is text' };
    if (value.indexOf('\n') >= 0 || value.indexOf('\r') >= 0)
      return { bad: 'a cell may not contain a line break — the plugin reads '
                    + 'this file one line at a time' };
    const text = value.trim();
    if (text === '') return null;     // a blank is always legal: no override
    const col = ((entry && entry.columns) || [])[ci] || {};
    if (entry && entry.kind === 'expanded') {
      const r = parseAdjust(text);
      return r.ok ? null
        : { bad: text + ' is not a valid adjustment. Expected blank, =N, +N, '
                 + '-N, xN, *N or a bare number.' };
    }
    if (/^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(text)) return null;
    if (col.op && col.op !== 'set')
      return { bad: text + ' is not a number, and this column carries the '
                    + col.op + ' operator. Overlays.cs drops the cell rather '
                    + 'than applying it, so the save would look like it worked '
                    + 'and change nothing.' };
    return { warn: text + ' is text, not a number. A plain-set column keeps it '
                   + 'as a literal, but NOTHING RANGE-CHECKED IT — '
                   + 'check_schema.py declares no columns for these sheets.' };
  }

  return {
    overlaySuppressed: overlaySuppressed, overlayHidden: overlayHidden,
    overlayCellProblem: overlayCellProblem,
    parseAdjust: parseAdjust, describeAdjust: describeAdjust,
    renderCfgValue: renderCfgValue, coerceCell: coerceCell, inRange: inRange,
    effective: effective, curvePoints: curvePoints, matrixDomain: matrixDomain,
    isKeepValue: isKeepValue, newMatrixCells: newMatrixCells,
    splitReference: splitReference,
    visibleAxis: visibleAxis,
    softWrap: softWrap, headSegments: headSegments, colWidth: colWidth,
    fmtCell: fmtCell, deepEqual: deepEqual,
  };
})();

</script>

<script>
'use strict';
const TOKEN = '__CKF_TOKEN__';
const $ = function (s, r) { return (r || document).querySelector(s); };
const el = function (tag, attrs, kids) {
  const n = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === 'class') n.className = attrs[k];
    else if (k === 'text') n.textContent = attrs[k];
    else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
  }
  for (const kid of (kids || [])) if (kid) n.appendChild(kid);
  return n;
};

let MODEL = null;      // exactly what the server read off disk
let W = null;          // the working copy every control edits
let SEL = null;        // selected section id (one subsystem, or a group of them)
let LAST_SAVE = null;
// What the requires enforcement did to the working copy since the last
// load: the keys one flip turned on, and the flip that was refused. Both
// are drawn as banners, because an auto-enable nobody is told about is a
// config changed behind the player's back.
let REQ_NOTES = [];
let REQ_REFUSAL = null;
// Lever-sheet columns the reader has put back after they were collapsed, keyed
// by the sheet's relative path. VIEW STATE ONLY: nothing here is in the working
// copy, in the dirty count or in a save, and a collapsed column is in all three
// whether or not it is on screen. It deliberately survives a save and a reload
// — a reader who asked to see a column did not ask to be shown it once.
let OV_SHOWN = {};

// ---------------------------------------------------------------------------
// transport

async function api(path, body) {
  const opt = { headers: { 'X-CKF-Token': TOKEN } };
  if (body !== undefined) {
    opt.method = 'POST';
    opt.headers['Content-Type'] = 'application/json';
    opt.body = JSON.stringify(body);
  }
  const r = await fetch(path, opt);
  const text = await r.text();
  if (!r.ok) throw new Error(path + ': ' + r.status + ' ' + text.slice(0, 400));
  return JSON.parse(text);
}

// ---------------------------------------------------------------------------
// schema access. Nothing below names a field: every lookup goes through the
// schema the server sent.

function schemas() { return MODEL.schemas; }
function schemaOf(sub) { return schemas().find(function (s) { return s.subsystem === sub; }); }
function sidecarOf(sch) {
  // A UNIT, not a filename: one physical file can hold several subsystems,
  // each under its own top-level section, and the server keys every table and
  // every edit by "file#section". A schema with no section keeps the bare
  // filename, so a config that never merged still resolves.
  const t = sch.targets || {};
  if (!t.json) return null;
  return t.section ? (t.json + '#' + t.section) : t.json;
}
function tableKey(name, path) { return name + '|' + path; }

// WHERE A FIELD LIVES, one identifying part per line.
//
// This used to be a single line -- "ckf.hardmode.json#difficulty -> path" --
// which read as one run-on token: the file, the section inside it and the key
// are three different kinds of thing, and the separators were the only thing
// distinguishing them. Split on the separators the server already keys by
// ("#" between file and section, "." between the steps of a key path) and give
// each part its own line, outermost first. Nothing here names a path; the
// parts come from the schema's own targets, exactly as before.
function pathParts(sch, f) {
  const parts = [];
  if (f.in !== 'cfg') {
    const sidecar = sidecarOf(sch);
    if (sidecar) for (const p of String(sidecar).split('#')) parts.push(p);
  }
  for (const p of String(f.path).split('.')) parts.push(p);
  return parts.filter(function (p) { return p !== ''; });
}

function pathCode(sch, f) {
  return el('code', { class: 'loc' }, pathParts(sch, f).map(function (p) {
    return el('span', { text: p });
  }));
}

// Sections are the page's unit of navigation. Usually one subsystem, sometimes
// two presented together; the order and the grouping are decided by the server
// (serve.py, PRESENTATION TABLES) so that nothing here has to name a subsystem.
function sections() { return MODEL.sections; }
function sectionOf(id) { return sections().find(function (s) { return s.id === id; }); }
function schemasOf(sec) {
  return (sec ? sec.subsystems : []).map(schemaOf).filter(Boolean);
}
function entryOf(sub) {
  return MODEL.enableIndex.find(function (e) { return e.subsystem === sub; });
}
function docParas(sch) { return sch.docParagraphs || []; }

// The field that a readonly table is a reference FOR: the editable field that
// declares it as its underlay. That is what lets the reference be drawn in the
// same shape, on the same axes, as the control beside it.
function ownerOf(sch, f) {
  if (f.ui !== 'readonly') return null;
  return sch.fields.find(function (g) { return g.over === f.path && g.axes; }) || null;
}

// The key space a field's value lives in. A `reference` field belongs to no
// file at all -- its rows are in the schema -- so it is keyed by its own
// subsystem. Every unit is a path carrying a dot, so the two cannot collide.
function valueUnitOf(sch, f) {
  return f.in === 'reference' ? sch.subsystem : sidecarOf(sch);
}
function fieldValue(sch, f) {
  if (f.in === 'cfg') return W.cfg[f.path];
  if (f.in === 'reference') return W.tables[tableKey(sch.subsystem, f.path)];
  return W.json[sidecarOf(sch)][f.path];
}

function linkedGroups() {
  const out = [];
  for (const s of schemas())
    for (const inv of (s.invariants || []))
      if (inv.kind === 'linkedEnable') out.push(inv);
  return out;
}
// A linkedEnable key has two spellings: "<file>#<section>.<path>" for a path
// inside a config document -- the notation `mirror` has always used -- and
// "Section.Key" for a key in the .cfg. Both are resolved against what the model
// actually carries rather than by splitting on a dot, so a path with dots in it
// cannot be mis-parsed and a key naming something this build does not have
// simply does not resolve.
//
// THE CFG SPELLING WAS UNREACHABLE HERE UNTIL 2026-09-13. This function looked
// only in W.json, so when split-config-into-toggleable-slices moved the linked
// pair back into ckf.hardmode.cfg every key in that group resolved to null,
// ticking either gate moved only itself, and nothing said so. That is the
// defect AGENTS.md section 3 is about; `linkedKeysUnresolved` below is what
// says it out loud now.
function linkedSlot(key) {
  if (W.cfg[key] !== undefined) return W.cfg[key];
  for (const unit in W.json)
    if (key.indexOf(unit + '.') === 0) {
      const path = key.slice(unit.length + 1);
      if (W.json[unit][path]) return W.json[unit][path];
    }
  return null;
}
// How a field is spelled when an invariant names it.
function gateKeyOf(sch, f) {
  return f.in === 'cfg' ? f.path : sidecarOf(sch) + '.' + f.path;
}
function linkedGroupFor(key) {
  return linkedGroups().find(function (g) { return g.keys.indexOf(key) >= 0; }) || null;
}
// Every linkedEnable key that resolves to no slot at all. A group whose keys do
// not resolve moves nothing when a gate is ticked; this is what the page draws
// instead of doing nothing quietly.
function linkedKeysUnresolved() {
  const out = [];
  for (const g of linkedGroups())
    for (const k of g.keys) if (!linkedSlot(k)) out.push(k);
  return out;
}
// The field that carries a schema's enable gate, found from the schema rather
// than named: the field whose `in` and `path` match what `enable` declares.
// null means the schema declares no gate of its own, which enable_index reports
// as 'n/a' and the nav says out loud rather than drawing a dead checkbox.
function gateFieldOf(sch) {
  const en = sch.enable || {};
  const want = en.cfg ? ['cfg', en.cfg] : (en.json ? ['json', en.json] : null);
  if (!want) return null;
  return sch.fields.find(function (f) {
    return f.in === want[0] && f.path === want[1]; }) || null;
}

// ---------------------------------------------------------------------------
// requires: directed, and enforced in both directions
//
// design.md section 4, "Enforcement is asymmetric on purpose". Turning a slice
// ON turns on every key its requires names, transitively, and names every key
// that changed. Turning a slice OFF that an enabled slice needs does not move
// the switch at all, and the message names the dependent. Both go through
// setBool, which is the one seam the nav toggle and the panel control share.
//
// The server runs the same two rules over the edit set on its way to disk, so
// a save that never came from this page is held to them too; check_schema's
// INVARIANT is the third line, and the only one that sees a .cfg edited by
// hand outside the editor.

// The .cfg's own file name, read off the schemas rather than written down: an
// invariant may spell a cfg key with that name in front of it, which is the
// spelling design.md section 4 uses, and bare. Both name the same key.
function cfgUnitName() {
  for (const s of schemas()) {
    const c = (s.targets || {}).cfg;
    if (c) return c;
  }
  return null;
}
function reqKey(key) {
  const c = cfgUnitName();
  return (c && key.indexOf(c + '#') === 0) ? key.slice(c.length + 1) : key;
}
function requiresGroups() {
  const out = [];
  for (const s of schemas())
    for (const inv of (s.invariants || []))
      if (inv.kind === 'requires')
        out.push({ subsystem: s.subsystem, title: s.title, dep: reqKey(inv.key),
                   needs: (inv.needs || []).map(reqKey), reason: inv.reason || '' });
  return out;
}
// THE FAILURE MODE THIS EXISTS TO STOP is the one Phase 1 found in linkedSlot:
// it looked only in W.json, so once the group's keys moved into the .cfg every
// one of them resolved to null, ticking a gate moved only itself, and nothing
// said so. linkedSlot reads the cfg first now and is reused here rather than
// copied, so requires cannot drift away from the fix; requiresKeysUnresolved
// below is what says it out loud if a key still resolves to nothing.
function reqSlot(key) { return linkedSlot(reqKey(key)); }

// The schema's declared default for a cfg key, or undefined.
function reqDefault(key) {
  for (const s of schemas())
    for (const f of s.fields)
      if (f.in === 'cfg' && f.path === key) return f.default;
  return undefined;
}
// Is the key on? A KEY THE FILE DOES NOT CARRY IS NOT "OFF" -- its schema
// declares a default and that is what applies until the key is written, and
// every slice schema on disk declares true. check_schema cannot use that: it
// grades what is in the file and reports an absent key SKIPPED. So on a fresh
// install this page is the stricter of the two, deliberately, and the hole
// tasks.md records for linkedEnable -- "the editor cannot protect a linked
// group on a fresh install" -- is not reproduced here. null is "cannot tell".
function reqOn(key) {
  const slot = reqSlot(key);
  if (!slot) return null;
  if (slot.present) return !!slot.value;
  const d = reqDefault(key);
  return (typeof d === 'boolean') ? d : null;
}
function subsystemTitleFor(key) {
  for (const s of schemas()) {
    const en = s.enable || {};
    if (en.cfg && en.cfg === key) return s.title;
  }
  return null;
}
function reqName(key) {
  const t = subsystemTitleFor(key);
  return t ? t + ' (' + key + ')' : key;
}
// Every requires key that resolves to no slot at all, so nothing here can move
// it or read it.
function requiresKeysUnresolved() {
  const out = [];
  for (const g of requiresGroups())
    for (const k of [g.dep].concat(g.needs))
      if (!reqSlot(k) && out.indexOf(k) < 0) out.push(k);
  return out;
}
// A violation standing in the working copy right now, whoever made it. This is
// the one state check_schema cannot grade: a dependent whose key is absent
// from the file is SKIPPED there, while here its default says it is on.
function requiresViolationsNow() {
  const out = [];
  for (const g of requiresGroups()) {
    if (reqOn(g.dep) !== true) continue;
    for (const n of g.needs) if (reqOn(n) === false) out.push({ dep: g.dep, need: n, reason: g.reason });
  }
  return out;
}
// Every enabled dependent that names one of `keys` among the things it needs.
// A dependent that is going off in the same move is not a blocker -- that is
// the same rule check_schema applies, where a false dependent is legal in
// every state.
function requiresBlockers(keys) {
  const out = [];
  for (const g of requiresGroups()) {
    if (keys.indexOf(g.dep) >= 0) continue;
    if (reqOn(g.dep) !== true) continue;
    for (const n of g.needs)
      if (keys.indexOf(n) >= 0) out.push({ dep: g.dep, need: n, reason: g.reason });
  }
  return out;
}
// Turn on everything the keys just turned on need, transitively. THE CHAIN
// ANSWER IS WRITTEN DOWN, not left to emerge: A needs B needs C turns C on,
// because B enters the frontier when it flips. A key enters the frontier only
// by flipping false -> true and can flip at most once, so a cycle terminates.
// Seeded ONLY by what this flip turned on: a dependent that was already on
// with its need already off is a hand-edited violation, and widening it here
// would change a config the player did not touch. That one goes to
// check_schema, which grades it INVARIANT and blocks the save.
function requiresEnable(seedKeys) {
  const changed = [];
  const groups = requiresGroups();
  let frontier = seedKeys.slice();
  let rounds = 0;
  while (frontier.length && rounds <= groups.length + 1) {
    rounds++;
    const next = [];
    for (const g of groups) {
      if (frontier.indexOf(g.dep) < 0 || reqOn(g.dep) !== true) continue;
      for (const n of g.needs) {
        const t = reqSlot(n);
        if (!t || reqOn(n) === true) continue;
        changed.push({ key: n, dep: g.dep, reason: g.reason, wasInFile: !!t.present });
        t.value = true;
        t.present = true;
        next.push(n);
      }
    }
    frontier = next;
  }
  if (frontier.length) changed.push({ key: null, unsettled: frontier.slice() });
  return changed;
}

// Flip one bool, moving every key its linkedEnable group names with it, then
// enforcing requires in the direction the flip went. The control in the panel
// and the toggle in the nav both go through here so the two cannot drift
// apart, and that is why the enforcement is here and not in either caller.
//
// Asymmetric on purpose (design.md section 4). On is a widening: every key
// the keys being turned on need is turned on with them, transitively, and
// REQ_NOTES names each one. Off is a breakage: nothing moves at all, and
// REQ_REFUSAL names the dependent that still needs it.
function setBool(sch, f, on) {
  const slot = fieldValue(sch, f);
  const key = gateKeyOf(sch, f);
  const grp = linkedGroupFor(key);
  // Everything this one flip moves: the key itself and, if it is in a linked
  // group, the rest of that group. A requires check that read only the key
  // would miss a partner being dragged off with it.
  const moved = [key];
  if (grp) for (const k of grp.keys) {
    const nk = reqKey(k);
    if (moved.indexOf(nk) < 0) moved.push(nk);
  }
  if (!on) {
    const blockers = requiresBlockers(moved);
    if (blockers.length) {
      // The working copy is not touched. render() redraws both controls from
      // it, so the box the player clicked goes back to where it was.
      REQ_REFUSAL = { moved: moved, blockers: blockers };
      render();
      return;
    }
  }
  REQ_REFUSAL = null;
  if (grp) for (const k of grp.keys) {
    const t = linkedSlot(k);
    if (t) { t.value = on; t.present = true; }
  }
  slot.value = on;
  slot.present = true;
  if (on) {
    const changed = requiresEnable(moved);
    if (changed.length) REQ_NOTES.push({ from: key, changed: changed });
  }
  render();
}

// ---------------------------------------------------------------------------
// the working copy

function buildWorking() {
  const w = { cfg: {}, json: {}, tables: {} };
  for (const p in MODEL.values.cfg) {
    const v = MODEL.values.cfg[p];
    w.cfg[p] = { present: v.present, value: v.value, error: v.error || null };
  }
  for (const name in MODEL.values.json) {
    w.json[name] = {};
    for (const p in MODEL.values.json[name]) {
      const v = MODEL.values.json[name][p];
      w.json[name][p] = { present: v.present, value: v.value === undefined ? null : v.value,
                          table: v.table || null, error: v.error || null };
    }
  }
  for (const k in MODEL.values.tables) {
    const t = MODEL.values.tables[k];
    w.tables[k] = { shape: t.shape, keyColumn: t.keyColumn, formats: t.formats,
                    present: t.present, sidecar: t.sidecar, path: t.path,
                    rows: JSON.parse(JSON.stringify(t.rows)) };
  }
  // THE LEVER SHEETS, cells only. A sheet's row is addressed by its identity
  // tuple and that tuple is not editable, so nothing here copies `key` or
  // `line`: both stay in MODEL, which is what the address is built from at save
  // time. Copying them would let an edit to a cell move the address of its own
  // row, which is the one way a positional write can land on the wrong line.
  //
  // EVERY sheet gets an entry, writable or not. A sheet that refuses writes
  // still has to compare equal to itself, and leaving it out would make
  // `W.overlays[rel]` undefined on exactly the paths that must not be guessed at.
  w.overlays = {};
  for (const rel in (MODEL.values.overlays || {})) {
    const e = MODEL.values.overlays[rel];
    w.overlays[rel] = { cells: (e.rows || []).map(function (r) {
      return (r.cells || []).slice(); }) };
  }
  return w;
}

// Every lever cell whose working value has moved off what the server read.
// One entry per CELL, not per sheet: the dirty count is what tells a reader
// they changed four things rather than one file, and the grid reads the same
// list to decide which boxes to stripe.
function overlayDirtyCells() {
  const out = [];
  for (const rel in (W.overlays || {})) {
    const src = (MODEL.values.overlays || {})[rel];
    const cur = W.overlays[rel].cells;
    if (!src) continue;
    (src.rows || []).forEach(function (r, i) {
      const was = r.cells || [], now = cur[i] || [];
      for (let j = 0; j < was.length; j++)
        if (String(now[j] === undefined ? '' : now[j]) !== String(was[j])) {
          out.push({ rel: rel, row: i, col: j, key: r.key || [],
                     from: was[j], to: now[j] });
        }
    });
  }
  return out;
}

function dirtyPaths() {
  const out = [];
  for (const p in W.cfg) {
    const a = MODEL.values.cfg[p], b = W.cfg[p];
    if (a.present !== b.present || !CKF.deepEqual(a.value, b.value)) out.push(p);
  }
  for (const name in W.json) for (const p in W.json[name]) {
    const a = MODEL.values.json[name][p], b = W.json[name][p];
    if (a.table) continue;
    if (a.present !== b.present || !CKF.deepEqual(a.value, b.value)) out.push(name + ':' + p);
  }
  for (const k in W.tables) {
    if (!CKF.deepEqual(MODEL.values.tables[k].rows, W.tables[k].rows)) out.push(k);
  }
  for (const c of overlayDirtyCells())
    out.push(c.rel + ':' + c.key.join('/') + '.' + c.col);
  return out;
}

// The edit set. Everything present is sent; the server compares against disk
// and writes only what actually differs, so this cannot invent a change.
function buildEdits() {
  const edits = { cfg: {}, json: {} };
  for (const s of schemas()) {
    const name = sidecarOf(s);
    for (const f of s.fields) {
      if (f.in === 'cfg') {
        const v = W.cfg[f.path];
        if (v.present && v.error == null) edits.cfg[f.path] = { value: v.value };
        continue;
      }
      const blk = edits.json[name] || (edits.json[name] = { scalars: {}, tables: {} });
      if (f.type === 'table') {
        const t = W.tables[tableKey(name, f.path)];
        if (!t) continue;
        // A table the schema declares that the file does not have stays absent
        // until it has a row. Sending an empty grid would turn an absent key
        // into a present empty one.
        if (!t.present && !t.rows.length) continue;
        blk.tables[f.path] = { shape: t.shape, rows: t.rows };
      } else {
        const v = W.json[name][f.path];
        if (v.error) continue;
        blk.scalars[f.path] = { present: v.present, value: v.value };
      }
    }
  }
  for (const name in edits.json) {
    const b = edits.json[name];
    if (!Object.keys(b.scalars).length && !Object.keys(b.tables).length) delete edits.json[name];
  }
  // THE LEVER SHEETS. Unlike .cfg and the sidecars, only what MOVED is sent.
  // Those two are whole values the server diffs against disk; a sheet is edited
  // one field of one line at a time, and a cell that is sent unchanged still
  // costs a note in the save log saying it already held that value. The 53
  // sheets carry 563 editable columns, so "send everything" is tens of
  // thousands of no-ops per save.
  //
  // THE ADDRESS IS THE IDENTITY TUPLE, AND IT COMES FROM THE SERVER'S COPY.
  // Not the ordinal: the first column alone is not unique on 9 of the 53 sheets
  // and one of them carries the same first cell five times over 17 rows. Not
  // the line number either — that is the writer's business. `row.key` is the
  // tuple the server computed; taking it from MODEL rather than from the
  // working copy is what makes an edit address the row it was made against.
  for (const c of overlayDirtyCells()) {
    const e = (MODEL.values.overlays || {})[c.rel];
    const col = (e.columns || [])[c.col];
    if (!col) continue;
    const blk = (edits.overlays || (edits.overlays = {}))[c.rel]
             || (edits.overlays[c.rel] = { cells: [] });
    // A cleared box is sent as the empty string, which is what the server
    // writes as an empty field: not 0, not "". "Leave the game's column alone"
    // has to be expressible, or a blank cell could never be got back to.
    blk.cells.push({ key: c.key, column: col.name,
                     value: c.to === undefined || c.to === null ? '' : String(c.to) });
  }
  return edits;
}

// ---------------------------------------------------------------------------
// what the server refused, matched back to the cell that caused it

// A save refusal is one message about the whole request, and the request may
// carry cells from several sheets. The message names the file, and usually the
// column and the row, because serve.py builds every one of them as
// "<rel>.<column>: ..." or "<rel>: no row has <cols> = <key>".
//
// So the match is made with the model's OWN strings — the rel it sent, the
// column names it sent, the key cells it sent — looked for in the text the
// server sent back. Nothing here spells a path or a column name, and a message
// that names none of them marks nothing rather than marking the wrong thing.
// The banner carries the server's exact words either way; this only decides
// which box to put a ring around.
function refusalText() {
  if (!LAST_SAVE || LAST_SAVE.ok) return '';
  const r = LAST_SAVE.refused || {};
  return String(r.summary || '') + ' ' + String(r.detail || '');
}

function refusalMark(ov, rel, ci, ri) {
  const t = refusalText();
  if (!t || t.indexOf(rel) < 0) return null;
  const name = (ov.columns[ci] || {}).name;
  if (name && t.indexOf(name) < 0) return null;
  const rows = ov.rows || [];
  // NARROWING, in the order the server's messages actually allow it. Each step
  // asks whether the message names something ONE row has; the last step is the
  // honest fallback, which is to mark the column rather than guess a row.
  //
  // 1. THE MESSAGE QUOTES A ROW'S IDENTITY. "no row has WeaponName, WeaponId,
  //    TalentId = Brightshot Optic, 99999, 80007" is this shape. A tuple only
  //    counts if one of its cells is at least three characters: an identity
  //    cell reading "1" occurs in almost any sentence, and a match on that is
  //    not a match.
  const namesRow = function (i) {
    const k = (rows[i].key || []).filter(Boolean).map(String);
    return k.length > 0
        && k.some(function (x) { return x.length >= 3; })
        && k.every(function (x) { return t.indexOf(x) >= 0; });
  };
  for (let i = 0; i < rows.length; i++) if (namesRow(i)) return namesRow(ri) ? t : null;
  // 2. THE MESSAGE QUOTES THE VALUE. "'90x' is not a valid adjustment" names
  //    no row at all, but it names what was typed, and this page knows which
  //    box holds it. Two boxes holding the same rejected text both light up,
  //    which is true: the server refused on the first and would refuse on the
  //    second.
  const cells = (W.overlays[rel] || {}).cells || [];
  const quoted = function (i) {
    const v = String((cells[i] || [])[ci] === undefined ? '' : (cells[i] || [])[ci]);
    return v !== '' && t.indexOf('\'' + v + '\'') >= 0;
  };
  for (let i = 0; i < rows.length; i++) if (quoted(i)) return quoted(ri) ? t : null;
  // 3. NOTHING IN IT NAMES A ROW. An unknown column, a file that would not
  //    parse, a sheet that refuses writes: the whole column is what it is
  //    about, so the whole column is what is marked.
  return t;
}

// ---------------------------------------------------------------------------
// banners

function banner(kind, title, lines) {
  return el('div', { class: 'banner ' + kind }, [
    el('h4', { text: title }),
    lines && lines.length
      ? el('ul', {}, lines.map(function (l) { return el('li', { class: 'small', text: l }); }))
      : null,
  ]);
}

function renderBanners() {
  const box = $('#banners');
  box.textContent = '';

  const p = MODEL.probe.config;
  if (p.state !== 'ok') {
    box.appendChild(banner(p.state === 'missing' ? 'warn' : 'err',
      'BepInEx/config is not writable (' + p.state + ')',
      [MODEL.configDir, p.detail,
       'Nothing has been written. That path is normally under Program Files and this '
       + 'tool does not assume either way — the line above is the result of an actual '
       + 'create-and-delete probe, not a guess.']));
  }

  if (MODEL.recovery && MODEL.recovery.found) {
    const r = MODEL.recovery;
    box.appendChild(banner(r.error ? 'err' : 'warn',
      'A previous save was interrupted and has been completed from its journal',
      [(r.completed.length ? 'finished: ' + r.completed.join(', ') : 'nothing left to finish'),
       (r.missing.length ? 'already done or unavailable: ' + r.missing.join(', ') : null),
       r.error].filter(Boolean)));
  }

  if (!MODEL.check.ran) {
    box.appendChild(banner('err', 'check_schema could not run — validation is unavailable',
      [MODEL.check.error || 'no detail',
       'A save is refused while this is true. Silence from a check that did not run is '
       + 'not a clean result.']));
  } else if (MODEL.check.problems.length) {
    const b = banner('warn', 'check_schema reports ' + MODEL.check.problems.length
      + ' problem(s) with what is on disk now', []);
    const ul = $('ul', b) || b.appendChild(el('ul', {}));
    for (const pr of MODEL.check.problems)
      ul.appendChild(el('li', { class: 'problem' }, [el('b', { text: pr.kind }),
        document.createTextNode(pr.message)]));
    box.appendChild(b);
  }

  // A linkedEnable key that resolves to nothing moves nothing when its gate is
  // ticked. Before this banner it did that silently, which is the shape
  // AGENTS.md section 3 is about.
  const unresolved = linkedKeysUnresolved();
  if (unresolved.length) {
    box.appendChild(banner('warn',
      unresolved.length + ' linked switch(es) name a key this build does not carry',
      [unresolved.join(', '),
       'Ticking one switch of a linked group is supposed to move the rest with '
       + 'it. These keys resolve to nothing, so they will not move, and the '
       + 'save is refused by the INVARIANT check rather than writing half a '
       + 'group. Nothing here is wrong on disk — the keys are declared by a '
       + 'schema and are not in the file yet.']));
  }

  // The same shape for requires: a key that resolves to nothing is a
  // declaration this page cannot enforce in either direction, and it says so
  // rather than enforcing nothing quietly.
  const reqGone = requiresKeysUnresolved();
  if (reqGone.length) {
    box.appendChild(banner('warn',
      reqGone.length + ' dependency key(s) name something this build does not carry',
      [reqGone.join(', '),
       'A requires declaration naming one of these cannot be enforced here in '
       + 'either direction: nothing is turned on for it and nothing is refused '
       + 'because of it. The declaration is stale, or the key belongs to a '
       + 'schema this build does not have.']));
  }

  // A violation standing right now, whoever made it. check_schema grades this
  // as INVARIANT and the save is blocked -- EXCEPT when the dependent's key is
  // absent from the file, where the checker reports it SKIPPED and this banner
  // is the only thing that says anything, because only this page falls back to
  // the schema's declared default.
  const reqBad = requiresViolationsNow();
  if (reqBad.length) {
    box.appendChild(banner('warn',
      reqBad.length + ' dependency(ies) are not satisfied by what is loaded',
      reqBad.map(function (v) {
        return reqName(v.dep) + ' is on and needs ' + reqName(v.need)
             + ', which is off. ' + v.reason;
      }).concat(['Turning either one is what fixes this: turn the dependency on, '
                 + 'or turn the slice that needs it off. Nothing has been changed '
                 + 'for you — this state was not made by a switch on this page.'])));
  }

  if (REQ_REFUSAL) {
    const r = REQ_REFUSAL;
    box.appendChild(banner('err',
      'That switch was not turned off — ' + r.blockers.length
        + ' enabled slice(s) still need it',
      r.blockers.map(function (b) {
        return reqName(b.dep) + ' needs ' + reqName(b.need) + '. ' + b.reason;
      }).concat(['Nothing was changed, and the switch is back where it was. '
                 + 'Turning a slice on is a widening and this page does it for '
                 + 'you; turning one off underneath something that needs it is '
                 + 'a breakage. Turn the slice that needs it off first.'])));
  }

  if (REQ_NOTES.length) {
    const lines = [];
    for (const n of REQ_NOTES)
      for (const c of n.changed)
        lines.push(c.key === null
          ? 'the dependency chain did not settle; ' + c.unsettled.join(', ')
            + ' was not followed. Nothing was turned on for it.'
          : 'turned on ' + reqName(c.key) + ' because ' + reqName(c.dep)
            + ' needs it' + (c.wasInFile ? '' : ' (the key is not in the file; '
            + 'saving adds it)') + '. ' + c.reason);
    box.appendChild(banner('info',
      lines.length + ' switch(es) were turned on for you by a dependency',
      lines.concat(['These are in the pending changes and go to disk with the '
                    + 'next save. Turning a slice on is a widening, so it is '
                    + 'done for you rather than refused — but never silently.'])));
  }

  // Top-level keys the files carry that no schema declares. The server
  // computed this all along and showed it to nobody; the checker's own
  // stray-key guard stopped running when the Phase 3 split removed the
  // sections it keyed off, so this page is the only place the state is
  // visible. Nothing is graded: a key deliberately left behind by an older
  // version and a key someone misspelled look exactly alike from disk, and
  // the spec requires both to be read, left without a control, and written
  // back untouched. Named, counted, and not called wrong.
  const stray = MODEL.strayKeys || {};
  const strayFiles = Object.keys(stray).sort();
  if (strayFiles.length) {
    const n = strayFiles.reduce(function (a, f) { return a + stray[f].length; }, 0);
    box.appendChild(banner('info',
      n + ' key(s) in ' + strayFiles.length + ' file(s) are not declared by any schema',
      strayFiles.map(function (f) { return f + ': ' + stray[f].join(', '); })
        .concat(['These are read, given no control on this page, and written '
                 + 'back exactly as they are — which is what a key an older '
                 + 'version left behind needs, and also what a misspelled key '
                 + 'looks like. Nothing on disk tells the two apart, so nothing '
                 + 'here calls any of them wrong. Check the spelling against '
                 + 'the setting you meant.'])));
  }

  for (const name in MODEL.sidecarErrors)
    box.appendChild(banner('err', 'Sidecar unreadable: ' + name, [MODEL.sidecarErrors[name]]));
  if (MODEL.cfgError)
    box.appendChild(banner('err', 'The .cfg could not be read', [MODEL.cfgError]));

  if (MODEL.missionReference.state !== 'loaded') {
    box.appendChild(banner('info', 'docs/mission-reference.json: ' + MODEL.missionReference.state,
      [MODEL.missionReference.detail || '',
       'The game\'s own values are not shown beside the slot editor while this is '
       + 'missing. '
       + 'That is an absent file, not an empty one.']));
  }

  if (LAST_SAVE) {
    if (LAST_SAVE.ok) {
      box.appendChild(banner('ok', 'Saved',
        [(LAST_SAVE.written.length ? 'wrote: ' + LAST_SAVE.written.join(', ')
                                   : 'nothing needed writing — every file already matched'),
         LAST_SAVE.relaunch,
         'check_schema after the save: ' + (LAST_SAVE.checkAfter.ran
           ? LAST_SAVE.checkAfter.problems.length + ' problem(s)'
           : 'could not run — ' + LAST_SAVE.checkAfter.error)]
          .concat((LAST_SAVE.notes || []))
          .filter(Boolean)));
    } else {
      const r = LAST_SAVE.refused || {};
      box.appendChild(banner('err', 'Save refused — nothing was written',
        [r.summary, r.detail].filter(Boolean)));
    }
  }
}

// ---------------------------------------------------------------------------
// the subsystem index

// The enable chain of one subsystem, as one readable line. The same text the
// panel puts under the title; the nav puts it in a tooltip.
function chainText(e) {
  return e.gates.concat(e.blocks).map(function (g) {
    return g.name + ' = ' + (g.state === null ? '?' : g.state)
      + (g.detail ? ' (' + g.detail + ')' : '');
  }).join('  AND  ');
}

// ONE GATE BOX, BUILT ONCE, WORN TWO WAYS.
//
// The nav and the panel used to build their own checkbox for the same gate,
// and by 2026-09-14 the two had drifted into disagreeing about it: the nav was
// three-state and disabled an absent key, the panel was two-state and left an
// absent key live. Both behaviours were asserted, and both assertions passed.
// That is what a duplicated control does. There is one now, and the two
// callers add only their own chrome.
//
// -> { cb, unreadable, state } or null when the schema declares no gate.
// `state` is the word for what the box is showing, and it is the SAME
// vocabulary the section pill and the enable chain use, so the page says one
// thing three times rather than three things once each.
//
// THREE STATES, NOT TWO, and the third is the reason this exists: checked is
// on, unchecked is off, and INDETERMINATE is COULD NOT BE READ. A gate whose
// key is absent from the .cfg must never be mistakable for one that was read
// and is false. `aria-checked="mixed"` carries that to a screen reader, which
// `.indeterminate` alone does not.
//
// THE BOX READS THE WORKING COPY, not the enable index the server computed, so
// a pending flip shows where it was made instead of snapping back to disk.
//
// A schema that declares no `enable` gets NO BOX rather than a dead checkbox.
function gateBox(sch) {
  const f = sch && gateFieldOf(sch);
  if (!f) return null;
  const slot = fieldValue(sch, f);
  const unreadable = !slot || !slot.present || !!slot.error;
  const cb = el('input', { type: 'checkbox' });
  cb.checked = !unreadable && !!slot.value;
  cb.indeterminate = unreadable;
  cb.setAttribute('aria-checked', unreadable ? 'mixed' : (cb.checked ? 'true' : 'false'));
  if (f.label) cb.setAttribute('aria-label', f.label);
  // NOT DISABLED WHEN THE KEY IS ABSENT, and this is a correction.
  //
  // WAS, in this function, until 2026-09-14:
  //   cb.disabled = !slot || (f.in === 'cfg' && !slot.present);
  // with the reason "The same rule the control in the panel uses: this tool
  // replaces a value line in ckf.hardmode.cfg and does not create one, because
  // BepInEx writes that file from the keys the plugin binds."
  //
  // THE PANEL'S CONTROL HAD ALREADY STOPPED USING THAT RULE and this comment
  // was the last place claiming the two agreed. split-config-into-toggleable-
  // slices reversed it there: CfgFile.set_value APPENDS a key the file does not
  // carry, 43 schemas declare a cfg gate, and disabling an absent key greyed
  // out every slice toggle until somebody launched the game once. The nav kept
  // disabling, so the same gate was writable on one screen and not on the
  // other. Merging the two controls forced the question, and the measured
  // answer is that the key IS writable — so the box stays live and the row
  // says that saving adds it. `slot` missing entirely is still dead, because
  // there is then nothing to write into.
  cb.disabled = !slot;
  return { cb: cb, unreadable: unreadable, f: f, slot: slot,
           state: unreadable ? 'could not be read'
                             : (cb.checked ? 'on' : 'off') };
}

// The nav's per-page toggle: gateBox plus the nav's own chrome.
function gateToggle(e) {
  const sch = schemaOf(e.subsystem);
  const g = gateBox(sch);
  if (!g) return null;
  const cb = g.cb;
  cb.className = 'tog';
  cb.title = e.title + ' — ' + (chainText(e) || 'no gate')
    + (g.unreadable ? '  (its key is not in the file — ticking it adds the key '
                      + 'when you save)' : '');
  // Ticking the box must not also select the page under it.
  cb.addEventListener('click', function (ev) {
    if (ev && ev.stopPropagation) ev.stopPropagation();
  });
  cb.addEventListener('change', function () { setBool(sch, g.f, cb.checked); });
  return cb;
}

// The state pill for one subsystem, from the entry the server computed.
function statePill(e) {
  const state = e.gatedByMaster ? 'off' : e.effective;
  return el('span', { class: 'pill ' + (state === 'n/a' ? 'na' : state),
                      title: e.title,
                      text: state === 'n/a' ? 'always' : state });
}

// A section's gates, folded into a summary that says how many are on.
//
// WHAT THIS REPLACES. navItem built its row as togs.concat([title]).concat(
// pills): one bare checkbox per subsystem, ahead of the name, plus one pill
// per subsystem after it. A section of twelve slices therefore opened with
// twelve unlabelled boxes and the name never fitted [reported by David,
// 2026-09-14]. Twelve boxes is also twelve targets told apart only by hover.
//
// WHAT SURVIVES UNCHANGED. These are the same gateToggle() nodes, built in the
// same order, still descendants of the nav item: three-state (indeterminate
// means COULD NOT BE READ, never false), the chain tooltip, cb.disabled where
// the key is not in the file, and the stopPropagation that keeps a tick from
// also navigating. Only where they sit changed. Open, each box now stands
// beside its own slice's name and state pill, which the bare row never gave.
//
// A section of ONE gate keeps its checkbox on the row: one box after the name
// costs nothing and is the fast path for two thirds of the nav.
function gateFold(ents) {
  const rows = [];
  let on = 0, unknown = 0, gates = 0;
  for (const e of ents) {
    const tg = gateToggle(e);
    if (tg) {
      gates++;
      if (tg.indeterminate) unknown++;
      else if (tg.checked) on++;
    }
    rows.push({ tog: tg, ent: e });
  }
  const det = el('details', { class: 'gates' });
  // The summary counts what is ON, read off the same checkbox state
  // gateToggle just computed from the WORKING copy, so a pending flip is
  // counted before it is saved. A section that declares no gate at all says
  // how many pages it holds instead of "0/0", which would read as all-off.
  const label = gates ? (on + '/' + gates + (unknown ? ' ?' : ''))
                      : (ents.length + ' pages');
  const sum = el('summary', {
    text: label,
    // Unknown is called out on the closed row too. A summary reading "0/12"
    // for twelve gates nobody could read would be the same lie the
    // indeterminate box exists to prevent.
    title: !gates
      ? ents.length + ' pages here, none of which declares a switch'
      : unknown
        ? (on + ' of ' + gates + ' on, ' + unknown + ' could not be read — open to see which')
        : (on + ' of ' + gates + ' switches on — open to set them one at a time'),
  });
  // Opening the list is not navigating to the page.
  sum.addEventListener('click', function (ev) {
    if (ev && ev.stopPropagation) ev.stopPropagation();
  });
  det.appendChild(sum);
  const list = el('div', { class: 'gatelist' });
  for (const r of rows) {
    // A span, not a <b>: the section title is the nav item's only <b>, and the
    // page's own DOM selftest reads the title off the first one.
    list.appendChild(el('div', { class: 'gaterow' }, [
      r.tog,
      el('span', { class: 'gn', text: r.ent.title, title: r.ent.title }),
      statePill(r.ent),
    ]));
  }
  det.appendChild(list);
  return det;
}

function navItem(sec) {
  const ents = sec.subsystems.map(entryOf).filter(Boolean);
  const whys = [];
  for (const e of ents) {
    whys.push(e.gatedByMaster ? 'gated off by ' + MODEL.masterKey
                              : (chainText(e) || 'no enable gate is declared for this page'));
  }
  const why = whys.join('   |   ');
  // NAME FIRST, and it is the only element that grows; everything after it is
  // fixed-width and cannot push it off the row.
  //
  // A section of ONE page keeps its checkbox and its pill on the row: one box
  // and one pill after the name cost nothing, and that is two thirds of the
  // nav. A section of MANY folds both into a summary, because twelve pills in
  // a 244px row crowd the name exactly as twelve boxes did. Every pill and
  // every box is still there, one click away, each beside its own page's name.
  const kids = [el('div', { class: 'nm' }, [el('b', { text: sec.title })])];
  if (ents.length === 1) {
    const tg = gateToggle(ents[0]);
    if (tg) kids.push(tg);
    kids.push(statePill(ents[0]));
  } else if (ents.length > 1) {
    kids.push(gateFold(ents));
  }
  return el('div', {
    class: 'navitem' + (SEL === sec.id ? ' sel' : ''),
    title: why || 'no enable gate',
    onclick: function () { SEL = sec.id; render(); },
  }, kids);
}

function groupHead(g) {
  return el('div', { class: 'navgroup', text: g.title,
                     title: g.note || g.title });
}

// Why a group is showing nothing. Never left blank: a header with no rows and
// no explanation reads as a page that failed to load.
function groupEmptyWhy(g) {
  if (g.note) return g.note;
  if (g.absent.length) return 'nothing here yet — ' + g.absent.length
    + ' page(s) have not been added: ' + g.absent.join(', ');
  return 'nothing here yet';
}

// One level of grouping. The order is the server's -- group headers are dropped
// in ahead of the first section that belongs to each, so the section order
// sections_for decided is never rearranged here.
function renderIndex() {
  const nav = $('#index');
  nav.textContent = '';
  const ng = MODEL.navGroups || { groups: [], ungrouped: [] };
  const byId = {};
  for (const g of ng.groups) byId[g.id] = g;
  const headed = {};
  for (const sec of sections()) {
    const g = byId[sec.group];
    if (g && !headed[g.id]) {
      headed[g.id] = true;
      nav.appendChild(groupHead(g));
      if (g.absent.length)
        nav.appendChild(el('div', { class: 'navnote',
          text: g.absent.length + ' page(s) not added yet: ' + g.absent.join(', ') }));
    }
    nav.appendChild(navItem(sec));
  }
  // A group that placed no section at all still appears, with the reason.
  for (const g of ng.groups) {
    if (headed[g.id]) continue;
    nav.appendChild(groupHead(g));
    nav.appendChild(el('div', { class: 'navnote', text: groupEmptyWhy(g) }));
  }
}

// ---------------------------------------------------------------------------
// controls, chosen by `ui` and `type` — never by name

// One line per group: the short facts read as a run, `absent means` is a
// sentence and gets its own line rather than trailing off the end of one.
function docBits(f) {
  const bits = [];
  if (f.default !== undefined) bits.push('default ' + JSON.stringify(f.default));
  if (f.range) bits.push('range [' + f.range[0] + ', ' + f.range[1] + ']');
  if (f.values) bits.push('one of ' + f.values.join(', '));
  if (f.enabledBy) bits.push('gated by ' + f.enabledBy);
  if (f.keyedBy) bits.push('keyed by ' + f.keyedBy);
  const lines = [];
  if (bits.length) lines.push(bits.join(' · '));
  if (f.absent) lines.push('absent means: ' + f.absent);
  return lines;
}

function docBitNodes(f) {
  return docBits(f).map(function (line) {
    return el('div', { class: 'meta', text: line });
  });
}

function gateState(sch, f) {
  if (!f.enabledBy) return true;
  if (f.in === 'cfg') {
    const v = W.cfg[f.enabledBy];
    return v ? !!v.value : null;
  }
  const v = W.json[sidecarOf(sch)][f.enabledBy];
  return v ? !!v.value : null;
}

function formControl(sch, f) {
  const slot = fieldValue(sch, f);
  const ctl = el('div', { class: 'ctl' });
  const commit = function (v, present) {
    slot.value = v;
